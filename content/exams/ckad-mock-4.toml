[[tasks]]
id = "q17"
domain = "networking"
weight = 4
title = "Restore a DNS alias behind egress isolation"
namespace = "mock4-q17"
task = '''Service `catalog-alias` in `mock4-q17` has a misspelled ExternalName target. Pod `resolver` also has a broken egress policy: DNS uses the wrong port and application access allows too many source-namespace Pods. Repair the alias to `catalog.mock4-q17-source.svc.cluster.local`, keeping it DNS-only (no selector, clusterIP or proxy). Repair NetworkPolicy `resolver-egress`, selecting app=resolver and isolating Egress only: permit UDP/TCP 53 to kube-system Pods labelled k8s-app=kube-dns; permit TCP 8080 only to app=catalog Pods in mock4-q17-source. Deny access to source Pod `decoy` on 8080 and catalog on 9090; both listeners really exist. Preserve all Pods, labels and source Services. From resolver, capture successful nslookup output for catalog-alias.mock4-q17.svc.cluster.local in `$PODDOJO_LAB_DIR/m4-catalog-dns.txt` and HTTP response from http://catalog-alias:8080/ in `$PODDOJO_LAB_DIR/m4-catalog-response.txt`. Expect catalog-primary. ExternalName does not proxy traffic or translate ports.'''
setup = [
'''kubectl -n mock4-q17-source run catalog --image=busybox:1.36 --restart=Never --labels=app=catalog --dry-run=client -o yaml --command -- sh -c 'mkdir -p /www; echo catalog-primary > /www/index.html; httpd -p 9090 -h /www; exec httpd -f -p 8080 -h /www' | kubectl apply -f -
kubectl -n mock4-q17-source expose pod catalog --port=8080 --target-port=8080 --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock4-q17 run resolver --labels=app=resolver --image=python:3.12-alpine --restart=Never --dry-run=client -o yaml --command -- sleep 14400 | kubectl apply -f -
kubectl -n mock4-q17 wait --for=condition=Ready pod/resolver --timeout=120s
kubectl -n mock4-q17-source wait --for=condition=Ready pod/catalog --timeout=120s
kubectl -n mock4-q17 apply -f - <<'EOF'
apiVersion: v1
kind: Service
metadata: {name: catalog-alias}
spec:
  type: ExternalName
  externalName: catalog.misspelled.svc.cluster.local
EOF
kubectl -n mock4-q17-source run decoy --image=busybox:1.36 --restart=Never --labels=app=decoy --dry-run=client -o yaml --command -- sh -c 'mkdir -p /www; echo not-catalog > /www/index.html; exec httpd -f -p 8080 -h /www' | kubectl apply -f -
kubectl -n mock4-q17-source wait --for=condition=Ready pod/decoy --timeout=120s
kubectl -n mock4-q17-source get pods catalog decoy -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}' > "$PODDOJO_LAB_DIR/m4-catalog-uid.txt"
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: resolver-egress, namespace: mock4-q17}
spec:
  podSelector: {matchLabels: {app: resolver}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: mock4-q17-source}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 5353}, {protocol: TCP, port: 5353}]
EOF'''
]
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: resolver-egress, namespace: mock4-q17}
spec:
  podSelector: {matchLabels: {app: resolver}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: mock4-q17-source}
      podSelector: {matchLabels: {app: catalog}}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
EOF
kubectl -n mock4-q17 patch service catalog-alias --type=merge -p '{"spec":{"externalName":"catalog.mock4-q17-source.svc.cluster.local"}}'
for i in $(seq 1 30); do
kubectl -n mock4-q17 exec resolver -- nslookup catalog-alias.mock4-q17.svc.cluster.local > "$PODDOJO_LAB_DIR/m4-catalog-dns.txt" && kubectl -n mock4-q17 exec resolver -- wget -qO- -T 2 http://catalog-alias:8080/ > "$PODDOJO_LAB_DIR/m4-catalog-response.txt" && break
sleep 2; done
test "$(cat "$PODDOJO_LAB_DIR/m4-catalog-response.txt")" = catalog-primary
```'''

