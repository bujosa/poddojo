title = "Replace misleading health checks on an intake service"
namespace = "mock4-q07"
task = '''Deployment `intake` in `mock4-q07` has a readiness connection error and a liveness check that always succeeds. Diagnose it without changing its ConfigMap, image, ports or mounts. Configure readiness HTTP `/ready` on the real 8081 listener every 2 seconds, liveness HTTP `/live` on that listener every 5 seconds, and startup TCP on that listener every 2 seconds with failureThreshold 30. You may use numeric or named probe ports. Keep one replica and wait for it to become ready. The root page is not the health contract: it returns 200 independently.'''
setup = [
'''kubectl -n mock4-q07 apply -f - <<'EOF'
