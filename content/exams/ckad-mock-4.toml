[[tasks]]
id = "q02"
domain = "design-build"
weight = 7
title = "Start a live identity publisher before the web process"
namespace = "mock4-q02"
task = '''Repair Deployment `directory` in `mock4-q02`. Its HTTP container serves an empty shared volume and cannot become ready. Keep the HTTP image, command, read-only mount and readiness probe. Add native sidecar `publish` (busybox:1.36), sharing volume `pages` with write access at `/www`. Every second it must write the actual Pod name plus a newline to `/www/identity`, obtaining the name through a downward API environment variable. The sidecar must continue running and use a startup exec probe that tests the identity file is nonempty before the HTTP container starts. Keep one replica. Requests to port 8080 `/identity` must return that replica's actual name.'''
setup = [
'''kubectl -n mock4-q02 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: directory}
spec:
  replicas: 1
  selector: {matchLabels: {app: directory}}
  template:
    metadata: {labels: {app: directory}}
    spec:
      volumes: [{name: pages, emptyDir: {}}]
      containers:
      - name: http
        image: busybox:1.36
        command: [httpd, -f, -p, '8080', -h, /www]
        volumeMounts: [{name: pages, mountPath: /www, readOnly: true}]
        readinessProbe:
          httpGet: {path: /identity, port: 8080}
          periodSeconds: 2
EOF'''
]
solution = '''```bash
kubectl -n mock4-q02 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: directory}
spec:
  replicas: 1
  selector: {matchLabels: {app: directory}}
  template:
    metadata: {labels: {app: directory}}
    spec:
      volumes: [{name: pages, emptyDir: {}}]
      initContainers:
      - name: publish
        image: busybox:1.36
        restartPolicy: Always
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        command: [sh, -c, 'while true; do printf "%s\n" "$POD_NAME" > /www/identity; sleep 1; done']
        volumeMounts: [{name: pages, mountPath: /www}]
        startupProbe:
          exec: {command: [test, -s, /www/identity]}
          periodSeconds: 1
          failureThreshold: 30
      containers:
      - name: http
        image: busybox:1.36
        command: [httpd, -f, -p, '8080', -h, /www]
        volumeMounts: [{name: pages, mountPath: /www, readOnly: true}]
        readinessProbe:
          httpGet: {path: /identity, port: 8080}
          periodSeconds: 2
EOF
kubectl -n mock4-q02 rollout status deployment/directory --timeout=120s
```'''

[[tasks.checks]]
name = '''A running native sidecar gates startup on the shared file'''
run = '''v=$(kubectl -n mock4-q02 get deploy directory -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="publish")].restartPolicy}|{.spec.template.spec.containers[?(@.name=="http")].image}|{.spec.template.spec.containers[?(@.name=="http")].command}|{.spec.template.spec.containers[?(@.name=="http")].volumeMounts[0].readOnly}') || exit 1
[ "$v" = 'Always|busybox:1.36|["httpd","-f","-p","8080","-h","/www"]|true' ] || exit 1
probe=$(kubectl -n mock4-q02 get deploy directory -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="publish")].startupProbe.exec.command}') || exit 1
case "$probe" in '["test","-s","/www/identity"]'|'["sh","-c","test -s /www/identity"]') ;; *) exit 1;; esac
name=$(kubectl -n mock4-q02 get deploy directory -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="publish")].env[?(@.valueFrom.fieldRef.fieldPath=="metadata.name")].name}') || exit 1
[ -n "$name" ] && echo ok'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''The ready replica serves its own name and keeps publishing'''
run = '''for i in $(seq 1 30); do
p=$(kubectl -n mock4-q02 get pods -l app=directory -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\n"}{end}' | head -n 1)
[ -n "$p" ] && [ "$(kubectl -n mock4-q02 get pod "$p" -o jsonpath='{.status.initContainerStatuses[?(@.name=="publish")].started}')" = true ] && [ "$(kubectl -n mock4-q02 exec "$p" -c http -- wget -qO- -T 2 http://127.0.0.1:8080/identity 2>/dev/null)" = "$p" ] && echo ok && exit 0
sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''HTTP readiness converges with one desired replica'''
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock4-q02 get deploy directory -o jsonpath='{.spec.replicas}|{.status.readyReplicas}|{.status.updatedReplicas}' 2>/dev/null) && [ "$v" = '1|1|1' ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 90

