[[tasks]]
id = "q01"
domain = "design-build"
weight = 6
title = "Ship a non-root batch digest image"
namespace = "mock4-q01"
task = '''In `mock4-q01`, package an integrity-check utility as `dojo/mock4-digest:v1`. Create its Dockerfile and build context under `$PODDOJO_LAB_DIR/m4-image`, using `busybox:1.36`. Include `/work/input.txt` containing exactly `warehouse=west` followed by one newline. The image itself must default to numeric UID 1200 and run a script that prints `uid=<actual id -u>` then `sha256sum /work/input.txt`. Load the image into kind `poddojo`, without pushing it. Create Job `digest`, backoffLimit 0, restartPolicy Never, using that image with IfNotPresent, runAsNonRoot and a read-only root filesystem. Do not override the image command or runtime UID in the Job. Keep the completed Job and capture its real logs in `$PODDOJO_LAB_DIR/m4-digest.txt`.'''
solution = '''```bash
mkdir -p "$PODDOJO_LAB_DIR/m4-image"
printf 'warehouse=west\n' > "$PODDOJO_LAB_DIR/m4-image/input.txt"
cat > "$PODDOJO_LAB_DIR/m4-image/digest.sh" <<'EOF'
#!/bin/sh
set -eu
printf 'uid=%s\n' "$(id -u)"
sha256sum /work/input.txt
EOF
cat > "$PODDOJO_LAB_DIR/m4-image/Dockerfile" <<'EOF'
FROM busybox:1.36
WORKDIR /work
COPY --chown=1200:1200 input.txt digest.sh ./
RUN chmod 0555 /work/digest.sh && chmod 0444 /work/input.txt
USER 1200
ENTRYPOINT ["/work/digest.sh"]
EOF
docker build -t dojo/mock4-digest:v1 "$PODDOJO_LAB_DIR/m4-image"
kind load docker-image dojo/mock4-digest:v1 --name poddojo
kubectl -n mock4-q01 apply -f - <<'EOF'
apiVersion: batch/v1
kind: Job
metadata: {name: digest}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: digest
        image: dojo/mock4-digest:v1
        imagePullPolicy: IfNotPresent
        securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true}
EOF
kubectl -n mock4-q01 wait --for=condition=complete job/digest --timeout=120s
kubectl -n mock4-q01 logs job/digest > "$PODDOJO_LAB_DIR/m4-digest.txt"
```'''

[[tasks.checks]]
name = '''Image defaults to UID 1200'''
run = '''u=$(docker image inspect dojo/mock4-digest:v1 --format '{{.Config.User}}') || exit 1; case "$u" in 1200|1200:*) echo ok;; *) exit 1;; esac'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''The hardened Job completes using the loaded image'''
run = '''kubectl -n mock4-q01 wait --for=condition=complete job/digest --timeout=60s >/dev/null || exit 1
v=$(kubectl -n mock4-q01 get job digest -o jsonpath='{.spec.backoffLimit}|{.spec.template.spec.restartPolicy}|{.spec.template.spec.containers[0].image}|{.spec.template.spec.containers[0].imagePullPolicy}|{.spec.template.spec.containers[0].securityContext.runAsNonRoot}|{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}|{.spec.template.spec.containers[0].command}|{.spec.template.spec.containers[0].args}|{.spec.template.spec.containers[0].securityContext.runAsUser}|{.spec.template.spec.securityContext.runAsUser}')
[ "$v" = '0|Never|dojo/mock4-digest:v1|IfNotPresent|true|true||||' ] && echo ok'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''Real execution reports its UID and the correct file digest'''
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock4-q01 logs job/digest 2>/dev/null) && [ "$v" = 'uid=1200
e8fc058b9d4faed7f6de5b0221c629785638c5318ac0be11b72dd3f11fe902b9  /work/input.txt' ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''Submitted evidence matches the successful Job logs'''
run = '''test "$(cat "$PODDOJO_LAB_DIR/m4-digest.txt")" = 'uid=1200
e8fc058b9d4faed7f6de5b0221c629785638c5318ac0be11b72dd3f11fe902b9  /work/input.txt' && test "$(kubectl -n mock4-q01 logs job/digest)" = 'uid=1200
