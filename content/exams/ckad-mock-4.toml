[[tasks]]
id = "q08"
domain = "observability"
weight = 7
title = "Diagnose unschedulable reconciliation workers"
namespace = "mock4-q08"
task = '''Two replicas of Deployment `reconciliation` in `mock4-q08` remain Pending. Save namespace FailedScheduling events (including their messages) to `$PODDOJO_LAB_DIR/m4-scheduling.txt`, then repair the Pod template to select existing Linux nodes using kubernetes.io/os=linux. Remove the impossible accelerator selector; do not label or edit nodes, recreate the Deployment, or change its worker image/command. Once two updated replicas are ready and old Pods have gone, save a name-sorted, headerless inventory to `$PODDOJO_LAB_DIR/m4-workers.txt`, with columns NAME, PHASE and NODE. Capture actual cluster output.'''
setup = [
'''kubectl -n mock4-q08 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: reconciliation}
spec:
  replicas: 2
  selector: {matchLabels: {app: reconciliation}}
  template:
    metadata: {labels: {app: reconciliation}}
    spec:
      nodeSelector: {poddojo.invalid/accelerator: missing}
      containers:
      - name: worker
        image: busybox:1.36
        command: [sh, -c, 'echo reconciliation-online; sleep 14400']
EOF
kubectl -n mock4-q08 get deploy reconciliation -o jsonpath='{.metadata.uid}' > "$PODDOJO_LAB_DIR/m4-reconciliation-uid.txt"
for i in $(seq 1 60); do
kubectl -n mock4-q08 get events --field-selector reason=FailedScheduling -o jsonpath='{range .items[*]}{.involvedObject.name}{" "}{.reason}{" "}{.message}{"\n"}{end}' | grep -Eq '(node selector|affinity)' && break
sleep 2; done
kubectl -n mock4-q08 get events --field-selector reason=FailedScheduling -o jsonpath='{range .items[*]}{.involvedObject.name}{" "}{.reason}{" "}{.message}{"\n"}{end}' | grep -Eq '(node selector|affinity)'
'''
]
