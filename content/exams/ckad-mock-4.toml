[[tasks]]
id = "q03"
domain = "design-build"
weight = 7
title = "Repair the scheduled warehouse audit"
namespace = "mock4-q03"
task = '''CronJob `warehouse-audit` in `mock4-q03` is paused and its worker is misconfigured. Preserve the schedule `*/20 * * * *`, timeZone Etc/UTC, image and command. Set REGION=west, suspend=false, concurrencyPolicy Forbid, startingDeadlineSeconds 60, successfulJobsHistoryLimit 2 and failedJobsHistoryLimit 1. Keep Job backoffLimit 0 and Pod restartPolicy Never. Create manual Job `audit-proof` from the corrected CronJob, retain it after completion, and save its logs to `$PODDOJO_LAB_DIR/m4-audit.txt`. The controller may create another scheduled run; do not depend on waiting for the clock.'''
setup = [
'''kubectl -n mock4-q03 apply -f - <<'EOF'
apiVersion: batch/v1
kind: CronJob
metadata: {name: warehouse-audit}
spec:
  schedule: '*/20 * * * *'
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: audit
            image: busybox:1.36
            env: [{name: REGION, value: unset}]
            command: [sh, -c, 'test "$REGION" = west && echo "audit region=$REGION"']
EOF'''
]
solution = '''```bash
