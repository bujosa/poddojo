        resources: {requests: {cpu: 500m, memory: 16Mi}, limits: {cpu: 500m, memory: 32Mi}}
      - name: forwarder
        image: busybox:1.36
        command: [sleep, '14400']
        resources: {requests: {cpu: 500m, memory: 16Mi}, limits: {cpu: 500m, memory: 32Mi}}
EOF
kubectl -n mock4-q11 get quota team-budget -o jsonpath='{.spec.hard}' > "$PODDOJO_LAB_DIR/m4-quota.txt"
kubectl -n mock4-q11 get limitrange container-bounds -o jsonpath='{.spec.limits}' > "$PODDOJO_LAB_DIR/m4-limits.txt"'''
