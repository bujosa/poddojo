[[tasks]]
id = "q13"
domain = "config-security"
weight = 4
title = "Project a short-lived token for a separate audience"
namespace = "mock4-q13"
task = '''In `mock4-q13`, create ServiceAccount and Pod both named `report-agent`. The Pod uses python:3.12-alpine, sleeps 14400 and sets automountServiceAccountToken=false. Explicitly project a ServiceAccount token using volume `report-token` into read-only mount `/var/run/report`, file `token`, for audience reports.poddojo.test with requested expirationSeconds 600. Use the TokenRequest-backed projected-volume mechanism, not a manually created Secret or `kubectl create token` pasted into a file. The default Kubernetes API token path must be absent. Verify the token audience and subject locally inside the Pod without printing or saving the complete token.'''
solution = '''```bash
kubectl -n mock4-q13 apply -f - <<'EOF'
apiVersion: v1
kind: ServiceAccount
metadata: {name: report-agent}
---
apiVersion: v1
kind: Pod
metadata: {name: report-agent}
spec:
  serviceAccountName: report-agent
  automountServiceAccountToken: false
  containers:
  - name: agent
    image: python:3.12-alpine
    command: [sleep, '14400']
    volumeMounts: [{name: report-token, mountPath: /var/run/report, readOnly: true}]
  volumes:
  - name: report-token
    projected:
      sources:
      - serviceAccountToken:
          audience: reports.poddojo.test
