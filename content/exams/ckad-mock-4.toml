[[tasks]]
id = "q05"
domain = "deployment"
weight = 6
title = "Upgrade the release display through Helm values"
namespace = "mock4-q05"
task = '''Existing Helm release `display` in `mock4-q05` uses the provided local chart `$PODDOJO_LAB_DIR/m4-chart`. Upgrade it in place, using values replicaCount=2, message=exam-ready-v4 and cpuRequest=40m; keep the image, Service port, resource names and chart templates. Put these overrides in `$PODDOJO_LAB_DIR/m4-display-values.yaml`, pass that file to Helm, and export the release's user-supplied values to `$PODDOJO_LAB_DIR/m4-display-export.yaml`. Both replicas must serve the new message through Service `release-display:80`. Preserve Helm ownership and release history; no repository access is needed.'''
setup = [
'''mkdir -p "$PODDOJO_LAB_DIR/m4-chart/templates"
cat > "$PODDOJO_LAB_DIR/m4-chart/Chart.yaml" <<'EOF'
apiVersion: v2
name: dojo-exam-display
version: 0.1.0
EOF
cat > "$PODDOJO_LAB_DIR/m4-chart/values.yaml" <<'EOF'
replicaCount: 1
message: staging-unapproved
cpuRequest: 20m
EOF
cat > "$PODDOJO_LAB_DIR/m4-chart/templates/app.yaml" <<'EOF'
apiVersion: v1
kind: ConfigMap
metadata: {name: release-display}
data:
  index.html: {{ .Values.message | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: release-display}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: release-display}}
  template:
    metadata:
      labels: {app: release-display}
      annotations:
        content-revision: {{ .Values.message | quote }}
    spec:
      volumes:
      - name: page
        configMap: {name: release-display}
      containers:
      - name: http
        image: busybox:1.36
        command: [httpd, -f, -p, '8080', -h, /www]
        resources:
          requests: {cpu: {{ .Values.cpuRequest | quote }}, memory: 8Mi}
        volumeMounts: [{name: page, mountPath: /www, readOnly: true}]
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: release-display}
spec:
  selector: {app: release-display}
  ports: [{name: http, port: 80, targetPort: 8080}]
EOF
helm upgrade --install display "$PODDOJO_LAB_DIR/m4-chart" -n mock4-q05 --wait --timeout=180s

cksum "$PODDOJO_LAB_DIR/m4-chart/Chart.yaml" "$PODDOJO_LAB_DIR/m4-chart/values.yaml" "$PODDOJO_LAB_DIR/m4-chart/templates/app.yaml" > "$PODDOJO_LAB_DIR/m4-chart-checksum.txt"'''
]
