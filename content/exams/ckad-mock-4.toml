        readinessProbe: {httpGet: {path: /ready, port: 8082}, periodSeconds: 2}
        livenessProbe: {exec: {command: ['true']}, periodSeconds: 5}
EOF
{
kubectl -n mock4-q07 get deploy intake -o jsonpath='{.spec.template.spec.containers[0].image}|{.spec.template.spec.containers[0].command}|{.spec.template.spec.containers[0].args}|{.spec.template.spec.containers[0].ports}|{.spec.template.spec.containers[0].volumeMounts}|{.spec.template.spec.volumes}'
