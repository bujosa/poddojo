[[tasks]]
id = "q11"
domain = "config-security"
weight = 5
title = "Fit two two-container replicas under admission limits"
namespace = "mock4-q11"
task = '''Deployment `aggregator` in `mock4-q11` has no usable replicas because its requests exceed the existing LimitRange and ResourceQuota. Keep both containers, their images/commands, two replicas, and its no-surge rolling strategy. Set each container to requests 40m CPU/16Mi memory and limits 80m CPU/32Mi memory (equivalent quantity syntax is accepted). Do not alter or delete `team-budget` or `container-bounds`. Diagnose admission from ReplicaSet events and wait for two ready replicas. Count both containers when budgeting the four running containers.'''
setup = [
'''kubectl -n mock4-q11 apply -f - <<'EOF'
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-budget}
spec:
  hard: {requests.cpu: 200m, requests.memory: 128Mi, limits.cpu: 400m, limits.memory: 256Mi, pods: '4'}
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-bounds}
spec:
  limits:
  - type: Container
    min: {cpu: 25m, memory: 8Mi}
    max: {cpu: 150m, memory: 64Mi}
    defaultRequest: {cpu: 50m, memory: 16Mi}
    default: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aggregator}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: aggregator}}
  template:
    metadata: {labels: {app: aggregator}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
