run = '''for i in $(seq 1 5); do
v=$(kubectl -n mock4-q17 exec resolver -- python -c 'import socket,struct
with open("/etc/resolv.conf") as f:
    dns=next(line.split()[1] for line in f if line.startswith("nameserver "))
name="catalog.mock4-q17-source.svc.cluster.local"
question=b"".join(bytes([len(p)])+p.encode() for p in name.split("."))+b"\0"+struct.pack("!HH",1,1)
query=struct.pack("!HHHHHH",1200,256,1,0,0,0)+question
family=socket.AF_INET6 if ":" in dns else socket.AF_INET
with socket.socket(family,socket.SOCK_DGRAM) as s:
    s.settimeout(3); s.sendto(query,(dns,53)); answer=s.recv(65535)
    assert len(answer)>=12 and struct.unpack("!H",answer[:2])[0]==1200 and answer[3]&15==0 and struct.unpack("!H",answer[6:8])[0]>0
with socket.create_connection((dns,53),3) as s:
    s.sendall(struct.pack("!H",len(query))+query)
    with s.makefile("rb") as f:
        length=f.read(2); assert len(length)==2
        answer=f.read(struct.unpack("!H",length)[0])
        assert len(answer)>=12 and struct.unpack("!H",answer[:2])[0]==1200 and answer[3]&15==0 and struct.unpack("!H",answer[6:8])[0]>0
print("ok")' 2>/dev/null) && [ "$v" = ok ] && echo ok && exit 0
