[[tasks]]
id = '''q18'''
domain = '''networking'''
weight = 4
title = '''Permit only DNS and a selected application destination'''
namespace = '''mock3-q18'''
task = '''In `mock3-q18`, Pods `archive` (app=archive, serving HTTP on 8443 and 8080), `ledger` (app=ledger), `worker` (role=worker) and `auditor` (role=auditor) already run. Create egress-only NetworkPolicy `worker-outbound` selecting matchLabels role=worker. Permit DNS over BOTH UDP and TCP port 53 only to Pods labelled k8s-app=kube-dns in namespace kube-system, using one peer that combines a namespaceSelector and a podSelector. Also permit TCP 8443 only to same-namespace Pods labelled app=archive. Use matchLabels for each selector. Deny all other worker egress; leave ingress, and every other Pod, unrestricted. Do not change the Pods. To test from the worker: `nslookup kubernetes.default.svc.cluster.local` must work and `wget -q -T 2 -O- http://<archive IP>:8443/` must succeed, while archive port 8080 and every port of ledger must be blocked.'''
setup = [
'''
