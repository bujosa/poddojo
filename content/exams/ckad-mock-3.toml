name = '''CRD is namespaced with the served storage version'''
run = '''kubectl get crd dojo-backups.mock3.poddojo.local -o jsonpath='{.spec.scope}|{.spec.versions[0].name}|{.spec.versions[0].served}|{.spec.versions[0].storage}''''
equals = '''Namespaced|v1|true|true'''

