'''kubectl -n mock3-q17-edge wait --for=condition=Ready pod/proxy pod/other --timeout=120s''',
'''kubectl -n mock3-q17-other wait --for=condition=Ready pod/proxy --timeout=120s'''
]
solution = '''
```bash
kubectl -n mock3-q17 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxy-only}
spec:
  podSelector:
    matchLabels: {app: private-api}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: mock3-q17-edge}
      podSelector:
        matchLabels: {app: ingress-proxy}
    ports: [{protocol: TCP, port: 8080}]
EOF
ip=$(kubectl -n mock3-q17 get pod private-api -o jsonpath='{.status.podIP}')
kubectl -n mock3-q17-edge exec proxy -- wget -q -T 2 -O- "http://$ip:8080/"
```
One list item with both selectors means "Pods labelled app=ingress-proxy **in** namespace mock3-q17-edge" (AND). Two list items (`- namespaceSelector` and `- podSelector`) would mean OR: every Pod of mock3-q17-edge, plus ingress-proxy Pods of mock3-q17 itself.'''

