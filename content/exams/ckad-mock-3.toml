namespace = '''mock3-q08'''
task = '''Deployment `slow-web` in `mock3-q08` needs 15 seconds to initialize and is repeatedly restarted by its bad startup probe. Keep its image and command unchanged. Configure a startup exec probe testing `/tmp/booted`, periodSeconds 2, failureThreshold 20. Configure readiness HTTP GET `/ready` on 8080, periodSeconds 3; configure liveness TCP 8080, periodSeconds 5. Ensure the one replica becomes ready; startup must gate the other probes.'''
setup = [
'''
kubectl -n mock3-q08 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: slow-web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-web}
  template:
    metadata:
      labels: {app: slow-web}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        ports: [{name: http, containerPort: 80}]
        command: [sh, -c, 'sleep 15; mkdir -p /www; echo ready > /www/ready; touch /tmp/booted; httpd -f -p 8080 -h /www']
        startupProbe:
          exec: {command: [sh, -c, 'test -f /tmp/never']}
          periodSeconds: 2
          failureThreshold: 1
EOF'''
]
