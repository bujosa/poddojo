[[tasks.negatives]]
name = '''DNS ports opened to every destination (no peer)'''
run = '''
kubectl -n mock3-q18 apply -f - <<'YAML' >/dev/null
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-outbound}
spec:
  podSelector:
    matchLabels: {role: worker}
  policyTypes: [Egress]
  egress:
  - ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - podSelector:
        matchLabels: {app: archive}
    ports: [{protocol: TCP, port: 8443}]
YAML'''
undo = '''
kubectl -n mock3-q18 delete networkpolicy worker-outbound --ignore-not-found >/dev/null
ip=$(kubectl -n mock3-q18 get pod ledger -o jsonpath='{.status.podIP}')
for i in $(seq 1 30); do kubectl -n mock3-q18 exec worker -- wget -q -T 2 -O- "http://$ip:8443/" >/dev/null 2>&1 && exit 0; sleep 1; done'''

[[tasks.negatives]]
name = '''empty podSelector restricts every Pod, not just the worker'''
run = '''
kubectl -n mock3-q18 apply -f - <<'YAML' >/dev/null
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-outbound}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - podSelector:
        matchLabels: {app: archive}
    ports: [{protocol: TCP, port: 8443}]
YAML'''
undo = '''
kubectl -n mock3-q18 delete networkpolicy worker-outbound --ignore-not-found >/dev/null
ip=$(kubectl -n mock3-q18 get pod ledger -o jsonpath='{.status.podIP}')
for i in $(seq 1 30); do kubectl -n mock3-q18 exec worker -- wget -q -T 2 -O- "http://$ip:8443/" >/dev/null 2>&1 && kubectl -n mock3-q18 exec auditor -- wget -q -T 2 -O- "http://$ip:8443/" >/dev/null 2>&1 && exit 0; sleep 1; done'''
