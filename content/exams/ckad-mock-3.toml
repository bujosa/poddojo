EOF''',
'''kubectl -n mock3-q18 wait --for=condition=Ready pod/archive pod/ledger pod/worker pod/auditor --timeout=120s'''
]
solution = '''
```bash
kubectl -n mock3-q18 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-outbound}
spec:
  podSelector:
    matchLabels: {role: worker}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - podSelector:
        matchLabels: {app: archive}
    ports: [{protocol: TCP, port: 8443}]
EOF
kubectl -n mock3-q18 exec worker -- nslookup kubernetes.default.svc.cluster.local
```
DNS falls back to TCP for large answers, so a UDP-only rule breaks lookups intermittently. A DNS rule without the `to` peer would let the worker reach port 53 on any destination.'''

