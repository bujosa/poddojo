[[tasks]]
id = '''q07'''
domain = '''deployment'''
weight = 5
title = '''Compose a generated-configuration overlay'''
namespace = '''mock3-q07'''
task = '''Create a Kustomize base and overlay under `$PODDOJO_LAB_DIR/m3-overlay`. The base must define one-replica Deployment `processor`, image `busybox:1.36`, command `sh -c 'echo "$MODE"; sleep 3600'`, with MODE from key MODE of ConfigMap `runtime`. The overlay `overlays/prod` must target `mock3-q07`, add suffix `-prod`, set 2 replicas, generate ConfigMap `runtime` with MODE=production, and add Pod label stage=production without changing the Deployment selector. Leave name-suffix hashing enabled and let Kustomize rewrite the ConfigMap reference. Apply the overlay; save its rendered YAML to `$PODDOJO_LAB_DIR/m3-overlay-rendered.yaml`.'''
solution = '''
```bash
mkdir -p "$PODDOJO_LAB_DIR/m3-overlay/base" "$PODDOJO_LAB_DIR/m3-overlay/overlays/prod"
cat > "$PODDOJO_LAB_DIR/m3-overlay/base/deploy.yaml" <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: processor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: processor}
  template:
    metadata:
      labels: {app: processor}
    spec:
      containers:
      - name: processor
        image: busybox:1.36
        command: [sh, -c, 'echo "$MODE"; sleep 3600']
        env:
        - name: MODE
          valueFrom:
            configMapKeyRef: {name: runtime, key: MODE}
EOF
cat > "$PODDOJO_LAB_DIR/m3-overlay/base/kustomization.yaml" <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deploy.yaml]
EOF
cat > "$PODDOJO_LAB_DIR/m3-overlay/overlays/prod/kustomization.yaml" <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: mock3-q07
nameSuffix: -prod
replicas:
- name: processor
  count: 2
configMapGenerator:
- name: runtime
  literals: [MODE=production]
labels:
- pairs: {stage: production}
  includeTemplates: true
  includeSelectors: false
EOF
kubectl kustomize "$PODDOJO_LAB_DIR/m3-overlay/overlays/prod" > "$PODDOJO_LAB_DIR/m3-overlay-rendered.yaml"
kubectl apply -k "$PODDOJO_LAB_DIR/m3-overlay/overlays/prod"
kubectl -n mock3-q07 rollout status deployment/processor-prod --timeout=120s
```'''

