task = '''Install a namespaced CRD named `dojo-backups.mock3.poddojo.local`, group `mock3.poddojo.local`, plural `dojo-backups`, singular `dojo-backup`, kind `DojoBackup`. Serve and store version v1 only. Require spec.destination (string) and spec.retention (integer from 1 through 30 inclusive) with a structural OpenAPI schema. In `mock3-q14`, create `nightly` with destination=`lab-archive`, retention=7. Save discovery output for this API group to `$PODDOJO_LAB_DIR/m3-backup-discovery.txt`. This exercise installs an API, not a controller: no actual backup or Ready status is expected.'''
