task = '''In `mock3-q12`, create ConfigMap `release-lock` with state=approved and ServiceAccount `deployer`. Create Role `lock-reader` granting only get on the named ConfigMap `release-lock` using resourceNames, and RoleBinding `read-lock` for this account. It must not list ConfigMaps, get any other ConfigMap, read Secrets, or create Deployments. Create Pod `deployer`, image `busybox:1.36`, command `sleep 3600`, using this ServiceAccount and its automatically projected API token. Do not create a legacy long-lived ServiceAccount-token Secret.'''
solution = '''
```bash
kubectl -n mock3-q12 create configmap release-lock --from-literal=state=approved --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q12 create serviceaccount deployer --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q12 apply -f - <<'EOF'
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lock-reader}
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [release-lock]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: read-lock}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lock-reader}
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: mock3-q12
---
apiVersion: v1
kind: Pod
metadata: {name: deployer}
spec:
  serviceAccountName: deployer
  automountServiceAccountToken: true
  containers:
  - name: deployer
    image: busybox:1.36
    command: [sleep, '3600']
EOF
kubectl -n mock3-q12 wait --for=condition=Ready pod/deployer --timeout=120s
