spec:
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '3600']}
---
apiVersion: v1
kind: Pod
metadata: {name: other, labels: {app: other}}
spec:
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '3600']}
EOF''',
'''
kubectl -n mock3-q17-other apply -f - <<'EOF'
