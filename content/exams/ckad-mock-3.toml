kind load docker-image dojo/mock3-banner:v2 --name poddojo >/dev/null
kubectl -n mock3-q01 create deployment banner --image=dojo/mock3-banner:v2 --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n mock3-q01 patch deployment banner --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"mock3-banner","imagePullPolicy":"IfNotPresent","securityContext":{"readOnlyRootFilesystem":true}}]}}}}' >/dev/null
kubectl -n mock3-q01 rollout status deployment/banner --timeout=120s >/dev/null'''
