[[tasks]]
id = '''q15'''
domain = '''networking'''
weight = 6
title = '''Expose two named container ports through one Service'''
namespace = '''mock3-q15'''
task = '''In `mock3-q15`, create Pod `dual` labeled app=dual with two containers: `public` from `nginx:1.27-alpine` listening on named container port `http`=80, and `admin` from `busybox:1.36` serving `admin-ready` plus a newline at `/` on named port `admin`=8080. Create ClusterIP Service `dual`, selecting app=dual, with named Service ports `web` 80 -> targetPort `http`, and `control` 9090 -> targetPort `admin`. Create Pod `tester`, image `busybox:1.36`, running `sleep 3600`. Both `http://dual:80/` and `http://dual:9090/` must work from tester using DNS. Keep the Service targetPorts as names, not numbers.'''
solution = '''
```bash
kubectl -n mock3-q15 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: dual, labels: {app: dual}}
spec:
  containers:
  - name: public
    image: nginx:1.27-alpine
    ports: [{name: http, containerPort: 80}]
  - name: admin
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /www; echo admin-ready > /www/index.html; httpd -f -p 8080 -h /www']
    ports: [{name: admin, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: dual}
spec:
  selector: {app: dual}
  ports:
  - {name: web, port: 80, targetPort: http}
  - {name: control, port: 9090, targetPort: admin}
---
apiVersion: v1
kind: Pod
metadata: {name: tester}
spec:
  containers:
  - name: tester
    image: busybox:1.36
    command: [sleep, '3600']
EOF
kubectl -n mock3-q15 wait --for=condition=Ready pod/dual pod/tester --timeout=120s
```'''

