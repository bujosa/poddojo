[[tasks]]
id = '''q17'''
domain = '''networking'''
weight = 5
title = '''Combine namespace and Pod selectors in a single peer'''
namespace = '''mock3-q17'''
task = '''In `mock3-q17`, Pod `private-api` (label app=private-api) serves HTTP on ports 8080 and 9090. Create NetworkPolicy `proxy-only` selecting matchLabels app=private-api that isolates ingress only. Permit TCP 8080 only from Pods labelled app=ingress-proxy in namespace `mock3-q17-edge`: use one ingress rule with one `from` peer that combines a namespaceSelector (on the automatic `kubernetes.io/metadata.name` label) and a podSelector, plus one explicit TCP port. Do not change the existing Pods or namespaces. To test: `mock3-q17-edge/proxy` (app=ingress-proxy) must reach `http://<private-api IP>:8080/`; `mock3-q17-edge/other` (app=other) and `mock3-q17-other/proxy` (app=ingress-proxy, another namespace) must be blocked, and port 9090 must be blocked for everyone.'''
setup = [
'''
kubectl -n mock3-q17 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: private-api, labels: {app: private-api}}
spec:
