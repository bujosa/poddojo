    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo ok > /w/index.html && httpd -p 8080 -h /w && httpd -f -p 8443 -h /w']
    ports: [{containerPort: 8443}, {containerPort: 8080}]
---
