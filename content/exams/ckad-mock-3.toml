[[tasks]]
id = '''q15'''
domain = '''networking'''
weight = 6
title = '''Expose two named container ports through one Service'''
namespace = '''mock3-q15'''
task = '''In `mock3-q15`, create Pod `dual` labeled app=dual with two containers: `public` from `nginx:1.27-alpine` listening on named container port `http`=80, and `admin` from `busybox:1.36` serving `admin-ready` plus a newline at `/` on named port `admin`=8080. Create ClusterIP Service `dual`, selecting app=dual, with named Service ports `web` 80 -> targetPort `http`, and `control` 9090 -> targetPort `admin`. Create Pod `tester`, image `busybox:1.36`, running `sleep 3600`. Both `http://dual:80/` and `http://dual:9090/` must work from tester using DNS. Keep the Service targetPorts as names, not numbers.'''
solution = '''
```bash
kubectl -n mock3-q15 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: dual, labels: {app: dual}}
spec:
  containers:
  - name: public
    image: nginx:1.27-alpine
    ports: [{name: http, containerPort: 80}]
  - name: admin
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /www; echo admin-ready > /www/index.html; httpd -f -p 8080 -h /www']
    ports: [{name: admin, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: dual}
spec:
  selector: {app: dual}
  ports:
  - {name: web, port: 80, targetPort: http}
  - {name: control, port: 9090, targetPort: admin}
---
apiVersion: v1
kind: Pod
metadata: {name: tester}
spec:
  containers:
  - name: tester
    image: busybox:1.36
    command: [sleep, '3600']
EOF
kubectl -n mock3-q15 wait --for=condition=Ready pod/dual pod/tester --timeout=120s
```'''

[[tasks.checks]]
name = '''Public Service port uses the named HTTP target'''
run = '''kubectl -n mock3-q15 get service/dual -o jsonpath='{.spec.ports[?(@.name=="web")].port}{"|"}{.spec.ports[?(@.name=="web")].targetPort}''''
equals = '''80|http'''

[[tasks.checks]]
name = '''Control Service port uses the named admin target'''
run = '''kubectl -n mock3-q15 get service/dual -o jsonpath='{.spec.ports[?(@.name=="control")].port}{"|"}{.spec.ports[?(@.name=="control")].targetPort}''''
equals = '''9090|admin'''

[[tasks.checks]]
name = '''Public endpoint resolves and serves HTTP'''
run = '''kubectl -n mock3-q15 get pod/tester >/dev/null 2>&1 || exit 1; for i in $(seq 1 30); do kubectl -n mock3-q15 exec tester -- wget -qO- -T 2 http://dual:80/ 2>/dev/null | grep 'Welcome to nginx!' >/dev/null && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 100

[[tasks.checks]]
name = '''Admin endpoint resolves and serves its own content'''
run = '''kubectl -n mock3-q15 get pod/tester >/dev/null 2>&1 || exit 1; for i in $(seq 1 30); do v=$(kubectl -n mock3-q15 exec tester -- wget -qO- -T 2 http://dual:9090/ 2>/dev/null); test "$v" = admin-ready && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 100

[[tasks]]
id = '''q16'''
domain = '''networking'''
weight = 5
title = '''Define TLS and multiple path types in an Ingress'''
namespace = '''mock3-q16'''
task = '''In `mock3-q16`, create one-replica Deployment `edge-api` from `nginx:1.27-alpine` and ClusterIP Service `edge-api` on port 80 targeting 80. Generate a self-signed certificate valid for DNS name `secure.dojo.test` (practice only), storing its key and certificate inside `$PODDOJO_LAB_DIR`; create TLS Secret `edge-tls`. Create networking.k8s.io/v1 Ingress `edge` with ingressClassName nginx, TLS host secure.dojo.test and secretName edge-tls. For host secure.dojo.test, route `/api` with Prefix and `/healthz` with Exact to edge-api port 80. No Ingress controller is installed; do not wait for an external address or attempt an external HTTPS request.'''
solution = '''
```bash
openssl req -x509 -nodes -newkey rsa:2048 -days 2 -subj '/CN=secure.dojo.test' -addext 'subjectAltName=DNS:secure.dojo.test' -keyout "$PODDOJO_LAB_DIR/m3-edge.key" -out "$PODDOJO_LAB_DIR/m3-edge.crt"
kubectl -n mock3-q16 create secret tls edge-tls --cert="$PODDOJO_LAB_DIR/m3-edge.crt" --key="$PODDOJO_LAB_DIR/m3-edge.key" --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q16 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-api}
  template:
    metadata:
      labels: {app: edge-api}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: edge-api}
spec:
  selector: {app: edge-api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: edge}
spec:
  ingressClassName: nginx
  tls:
  - hosts: [secure.dojo.test]
    secretName: edge-tls
  rules:
  - host: secure.dojo.test
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: {name: edge-api, port: {number: 80}}
      - path: /healthz
        pathType: Exact
        backend:
          service: {name: edge-api, port: {number: 80}}
EOF
kubectl -n mock3-q16 rollout status deployment/edge-api --timeout=120s
```'''

[[tasks.checks]]
name = '''Ingress specifies TLS host and Secret'''
run = '''kubectl -n mock3-q16 get ingress/edge -o jsonpath='{.spec.ingressClassName}{"|"}{.spec.tls[0].hosts[0]}{"|"}{.spec.tls[0].secretName}''''
equals = '''nginx|secure.dojo.test|edge-tls'''

[[tasks.checks]]
name = '''API route uses Prefix matching'''
run = '''kubectl -n mock3-q16 get ingress/edge -o jsonpath='{.spec.rules[0].host}{"|"}{.spec.rules[0].http.paths[?(@.path=="/api")].pathType}{"|"}{.spec.rules[0].http.paths[?(@.path=="/api")].backend.service.name}{"|"}{.spec.rules[0].http.paths[?(@.path=="/api")].backend.service.port.number}''''
equals = '''secure.dojo.test|Prefix|edge-api|80'''

[[tasks.checks]]
name = '''Health route uses Exact matching'''
run = '''kubectl -n mock3-q16 get ingress/edge -o jsonpath='{.spec.rules[0].http.paths[?(@.path=="/healthz")].pathType}{"|"}{.spec.rules[0].http.paths[?(@.path=="/healthz")].backend.service.name}{"|"}{.spec.rules[0].http.paths[?(@.path=="/healthz")].backend.service.port.number}''''
equals = '''Exact|edge-api|80'''

[[tasks.checks]]
name = '''TLS Secret has the TLS type and a certificate for the requested host'''
run = '''test "$(kubectl -n mock3-q16 get secret/edge-tls -o jsonpath='{.type}')" = kubernetes.io/tls && kubectl -n mock3-q16 get secret edge-tls -o jsonpath='{.data.tls\.crt}' | openssl base64 -d -A | openssl x509 -noout -checkhost secure.dojo.test | grep 'does match certificate' >/dev/null && echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''deployment/edge-api becomes ready'''
run = '''kubectl -n mock3-q16 get deployment/edge-api >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock3-q16 get deployment/edge-api -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "1" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks]]
id = '''q17'''
domain = '''networking'''
weight = 5
title = '''Combine namespace and Pod selectors in a single peer'''
namespace = '''mock3-q17'''
task = '''In `mock3-q17`, create NetworkPolicy `proxy-only` selecting matchLabels app=private-api. Isolate ingress only. Permit TCP 8080 only from Pods labeled app=ingress-proxy in namespace kube-system. Use one ingress rule, one from peer containing BOTH namespaceSelector.matchLabels `kubernetes.io/metadata.name: kube-system` and podSelector.matchLabels `app: ingress-proxy`, and one explicit TCP port. Do not change kube-system or create a proxy there; this task assesses the specification. Avoid accidentally allowing either every Pod in kube-system or every ingress-proxy Pod in any namespace.'''
solution = '''
```bash
kubectl -n mock3-q17 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxy-only}
spec:
  podSelector:
    matchLabels: {app: private-api}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app: ingress-proxy}
    ports: [{protocol: TCP, port: 8080}]
EOF
```'''

[[tasks.checks]]
name = '''Only private API ingress is isolated'''
run = '''kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.podSelector.matchLabels.app}{"|"}{.spec.policyTypes[*]}''''
equals = '''private-api|Ingress'''

[[tasks.checks]]
name = '''Namespace and Pod restrictions share the same peer'''
run = '''kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.ingress[0].from[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name}{"|"}{.spec.ingress[0].from[0].podSelector.matchLabels.app}''''
equals = '''kube-system|ingress-proxy'''

[[tasks.checks]]
name = '''Only TCP port 8080 is allowed'''
run = '''kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.ingress[0].ports[0].protocol}{"|"}{.spec.ingress[0].ports[0].port}''''
equals = '''TCP|8080'''

[[tasks.checks]]
name = '''No extra peer, rule, or port broadens the allowance'''
run = '''kubectl -n mock3-q17 get networkpolicy proxy-only >/dev/null && test -z "$(kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.ingress[1]}')" && test -z "$(kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.ingress[0].from[1]}')" && test -z "$(kubectl -n mock3-q17 get networkpolicy/proxy-only -o jsonpath='{.spec.ingress[0].ports[1]}')" && echo ok'''
equals = '''ok'''

[[tasks]]
id = '''q18'''
domain = '''networking'''
weight = 4
title = '''Permit only DNS and a selected application destination'''
namespace = '''mock3-q18'''
task = '''In `mock3-q18`, create egress-only NetworkPolicy `worker-outbound` selecting matchLabels role=worker. Permit DNS over BOTH UDP and TCP port 53 only to Pods labeled k8s-app=kube-dns in namespace kube-system. Also permit TCP 8443 only to same-namespace Pods labeled app=archive. Use exactly two egress rules: one DNS rule with one peer combining namespaceSelector and podSelector, and one archive rule with one podSelector peer. Use matchLabels for each selector. Deny all other worker egress and leave ingress unrestricted. The policy spec is assessed; no metrics-server, archive server or extra CNI installation is required.'''
solution = '''
```bash
kubectl -n mock3-q18 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-outbound}
spec:
  podSelector:
    matchLabels: {role: worker}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - podSelector:
        matchLabels: {app: archive}
    ports: [{protocol: TCP, port: 8443}]
EOF
```'''

[[tasks.checks]]
name = '''Worker egress is isolated without isolating ingress'''
run = '''kubectl -n mock3-q18 get networkpolicy/worker-outbound -o jsonpath='{.spec.podSelector.matchLabels.role}{"|"}{.spec.policyTypes[*]}''''
equals = '''worker|Egress'''

[[tasks.checks]]
name = '''DNS peer selects only kube-system DNS Pods'''
run = '''kubectl -n mock3-q18 get networkpolicy worker-outbound -o jsonpath='{range .spec.egress[*].to[*]}{.namespaceSelector.matchLabels.kubernetes\.io/metadata\.name}{"|"}{.podSelector.matchLabels.k8s-app}{"\n"}{end}' | grep -x 'kube-system|kube-dns''''
equals = '''kube-system|kube-dns'''

[[tasks.checks]]
name = '''DNS allows both TCP and UDP 53 in the same rule'''
run = '''kubectl -n mock3-q18 get networkpolicy worker-outbound -o jsonpath='{range .spec.egress[?(@.to[0].podSelector.matchLabels.k8s-app=="kube-dns")].ports[*]}{.protocol}{" "}{.port}{"\n"}{end}' | sort'''
equals = '''
TCP 53
UDP 53'''

[[tasks.checks]]
name = '''Archive is the sole application egress destination'''
run = '''kubectl -n mock3-q18 get networkpolicy worker-outbound -o jsonpath='{range .spec.egress[?(@.to[0].podSelector.matchLabels.app=="archive")]}{.to[0].podSelector.matchLabels.app}{"|"}{.ports[0].protocol}{"|"}{.ports[0].port}{"|"}{.to[0].namespaceSelector}{end}''''
equals = '''archive|TCP|8443|'''

[[tasks.checks]]
name = '''No extra rule or peer opens unrestricted egress'''
run = '''test "$(kubectl -n mock3-q18 get networkpolicy/worker-outbound -o jsonpath='{.spec.egress[*].to[0].podSelector.matchLabels.*}')" != '' && test -z "$(kubectl -n mock3-q18 get networkpolicy/worker-outbound -o jsonpath='{.spec.egress[2]}')" && test -z "$(kubectl -n mock3-q18 get networkpolicy/worker-outbound -o jsonpath='{.spec.egress[*].to[1]}')" && test -z "$(kubectl -n mock3-q18 get networkpolicy/worker-outbound -o jsonpath='{.spec.egress[?(@.to[0].podSelector.matchLabels.app=="archive")].ports[1]}')" && echo ok'''
equals = '''ok'''
