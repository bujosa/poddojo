[[tasks]]
id = '''q04'''
domain = '''deployment'''
weight = 6
title = '''Introduce a canary into a shared Service'''
namespace = '''mock3-q04'''
task = '''In `mock3-q04`, Deployment `gateway-stable` has 3 replicas with Pod labels app=gateway,track=stable. Service `gateway` currently selects only stable. Create `gateway-canary`, one replica of `nginx:1.27-alpine`, labels app=gateway,track=canary. Configure `gateway` to route to both tracks by selecting app=gateway only. Keep all three stable replicas. Expect four ready backend addresses; no exact traffic percentage is guaranteed by Service load balancing.'''
setup = [
'''
kubectl -n mock3-q04 apply -f - <<'EOF'
apiVersion: apps/v1
