[[tasks]]
id = '''q14'''
domain = '''config-security'''
weight = 5
title = '''Extend the API with a validated namespaced resource'''
namespace = '''mock3-q14'''
task = '''Install a namespaced CRD named `dojo-backups.mock3.poddojo.local`, group `mock3.poddojo.local`, plural `dojo-backups`, singular `dojo-backup`, kind `DojoBackup`. Serve and store version v1 only. Require spec.destination (string) and spec.retention (integer from 1 through 30 inclusive) with a structural OpenAPI schema. In `mock3-q14`, create `nightly` with destination=`lab-archive`, retention=7. Save discovery output for this API group to `$PODDOJO_LAB_DIR/m3-backup-discovery.txt`. This exercise installs an API, not a controller: no actual backup or Ready status is expected.'''
solution = '''
```bash
kubectl -n mock3-q14 apply -f - <<'EOF'
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: dojo-backups.mock3.poddojo.local}
spec:
  group: mock3.poddojo.local
  scope: Namespaced
  names: {plural: dojo-backups, singular: dojo-backup, kind: DojoBackup}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [destination, retention]
            properties:
              destination: {type: string}
              retention: {type: integer, minimum: 1, maximum: 30}
EOF
kubectl wait --for=condition=Established crd/dojo-backups.mock3.poddojo.local --timeout=60s
kubectl api-resources --api-group=mock3.poddojo.local > "$PODDOJO_LAB_DIR/m3-backup-discovery.txt"
kubectl -n mock3-q14 apply -f - <<'EOF'
apiVersion: mock3.poddojo.local/v1
kind: DojoBackup
metadata: {name: nightly}
spec: {destination: lab-archive, retention: 7}
EOF
```'''

