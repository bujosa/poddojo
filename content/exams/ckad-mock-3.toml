run = '''kubectl -n mock3-q07 get deployment/processor-prod >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock3-q07 get deployment/processor-prod -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "2" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
