kind: Job
metadata: {name: import-recovered}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: importer
        image: busybox:1.36
        env: [{name: MODE, value: restore}]
        command: [sh, -c, 'if [ "$MODE" != restore ]; then echo ERROR missing MODE=restore; exit 23; fi; echo restore-complete']
EOF
kubectl -n mock3-q09 wait --for=condition=complete job/import-recovered --timeout=120s
