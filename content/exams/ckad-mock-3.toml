[[tasks]]
id = '''q13'''
domain = '''config-security'''
weight = 7
title = '''Satisfy restricted admission and a tight resource budget'''
namespace = '''mock3-q13'''
task = '''In `mock3-q13`, enable Pod Security Admission enforce=restricted, pinned to v1.37. Create ResourceQuota `restricted-budget` with hard requests.cpu=100m,requests.memory=128Mi,limits.cpu=200m,limits.memory=256Mi,pods=2. Create Deployment `sandbox`, two replicas, image `busybox:1.36`, command `sleep 3600`. Each container must request 25m CPU/32Mi memory and limit 50m CPU/64Mi memory. Meet restricted admission: UID/GID 1000, runAsNonRoot=true, RuntimeDefault seccomp, drop ALL capabilities, and allowPrivilegeEscalation=false. Also require readOnlyRootFilesystem=true. Keep quota and admission active, and reach two ready replicas.'''
solution = '''
```bash
kubectl label namespace mock3-q13 pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=v1.37 --overwrite
kubectl -n mock3-q13 apply -f - <<'EOF'
apiVersion: v1
kind: ResourceQuota
metadata: {name: restricted-budget}
spec:
  hard:
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.cpu: 200m
    limits.memory: 256Mi
    pods: '2'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sandbox}
spec:
  replicas: 2
  selector:
    matchLabels: {app: sandbox}
  template:
    metadata:
      labels: {app: sandbox}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: sandbox
        image: busybox:1.36
        command: [sleep, '3600']
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 50m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
EOF
kubectl -n mock3-q13 rollout status deployment/sandbox --timeout=180s
```'''

