[[tasks]]
id = '''q10'''
domain = '''observability'''
weight = 5
title = '''Migrate a removed batch API safely'''
namespace = '''mock3-q10'''
task = '''File `$PODDOJO_LAB_DIR/m3-rotate-legacy.yaml` defines a CronJob with an API version that is no longer served. Discover the served batch APIs using `kubectl api-resources --api-group=batch -o wide`, saving the output to `$PODDOJO_LAB_DIR/m3-batch-apis.txt`. Create a corrected manifest `$PODDOJO_LAB_DIR/m3-rotate.yaml` using the supported stable API; retain the original name `rotate`, image, command and schedule. Set suspend=true before applying it in `mock3-q10`, so automatic runs cannot start. Prove the template still works by creating manual Job `rotate-check` from the CronJob and waiting for completion.'''
setup = [
'''
cat > "$PODDOJO_LAB_DIR/m3-rotate-legacy.yaml" <<'EOF'
apiVersion: batch/v1beta1
kind: CronJob
metadata: {name: rotate}
spec:
  schedule: '0 */6 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: rotate
            image: busybox:1.36
            command: [sh, -c, 'echo api-migrated']
EOF'''
]
solution = '''
```bash
kubectl api-resources --api-group=batch -o wide > "$PODDOJO_LAB_DIR/m3-batch-apis.txt"
sed 's@apiVersion: batch/v1beta1@apiVersion: batch/v1@' "$PODDOJO_LAB_DIR/m3-rotate-legacy.yaml" > "$PODDOJO_LAB_DIR/m3-rotate.yaml"
awk '{print} /^spec:$/ {print "  suspend: true"}' "$PODDOJO_LAB_DIR/m3-rotate.yaml" > "$PODDOJO_LAB_DIR/m3-rotate-suspended.yaml"
cp "$PODDOJO_LAB_DIR/m3-rotate-suspended.yaml" "$PODDOJO_LAB_DIR/m3-rotate.yaml"
kubectl -n mock3-q10 apply -f "$PODDOJO_LAB_DIR/m3-rotate.yaml"
kubectl -n mock3-q10 create job rotate-check --from=cronjob/rotate
kubectl -n mock3-q10 wait --for=condition=complete job/rotate-check --timeout=120s
```'''

[[tasks.checks]]
name = '''Stable CronJob retains schedule and is suspended'''
run = '''kubectl -n mock3-q10 get cronjob/rotate -o jsonpath='{.apiVersion}{"|"}{.spec.schedule}{"|"}{.spec.suspend}''''
equals = '''batch/v1|0 */6 * * *|true'''

[[tasks.checks]]
name = '''Stable batch API discovery was saved'''
run = '''grep 'cronjobs' "$PODDOJO_LAB_DIR/m3-batch-apis.txt" | grep 'batch/v1' >/dev/null && echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''Corrected manifest uses batch/v1 and keeps the job definition, suspended'''
run = '''f="$PODDOJO_LAB_DIR/m3-rotate.yaml"; grep -E '^apiVersion:[[:space:]]*batch/v1[[:space:]]*$' "$f" >/dev/null || exit 1; kubectl create --dry-run=client -f "$f" -o jsonpath='{.kind}{"|"}{.metadata.name}{"|"}{.spec.schedule}{"|"}{.spec.suspend}{"|"}{.spec.jobTemplate.spec.template.spec.containers[0].image}{"|"}{.spec.jobTemplate.spec.template.spec.containers[0].command[2]}' '''
equals = '''CronJob|rotate|0 */6 * * *|true|busybox:1.36|echo api-migrated'''

[[tasks.checks]]
name = '''job/rotate-check was created from the CronJob and completes'''
run = '''test "$(kubectl -n mock3-q10 get job/rotate-check -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')" = CronJob/rotate || exit 1; kubectl -n mock3-q10 wait --for=condition=complete job/rotate-check --timeout=90s >/dev/null && echo ok'''
equals = '''ok'''
timeout = 110

[[tasks.negatives]]
name = '''recreates the CronJob imperatively and never writes the corrected manifest'''
run = '''
kubectl api-resources --api-group=batch -o wide > m3-batch-apis.txt
kubectl -n mock3-q10 create cronjob rotate --image=busybox:1.36 --schedule='0 */6 * * *' --restart=Never -- sh -c 'echo api-migrated' >/dev/null
kubectl -n mock3-q10 patch cronjob rotate --type=merge -p '{"spec":{"suspend":true}}' >/dev/null
kubectl -n mock3-q10 create job rotate-check --from=cronjob/rotate >/dev/null
kubectl -n mock3-q10 wait --for=condition=complete job/rotate-check --timeout=120s >/dev/null'''
undo = '''
kubectl -n mock3-q10 delete job rotate-check --ignore-not-found --wait=true >/dev/null
kubectl -n mock3-q10 delete cronjob rotate --ignore-not-found --wait=true >/dev/null
rm -f m3-batch-apis.txt m3-rotate.yaml'''

[[tasks.negatives]]
name = '''runs a standalone Job named rotate-check instead of one created from the CronJob'''
run = '''
kubectl api-resources --api-group=batch -o wide > m3-batch-apis.txt
sed 's@apiVersion: batch/v1beta1@apiVersion: batch/v1@' m3-rotate-legacy.yaml | awk '{print} /^spec:$/ {print "  suspend: true"}' > m3-rotate.yaml
kubectl -n mock3-q10 apply -f m3-rotate.yaml >/dev/null
kubectl -n mock3-q10 create job rotate-check --image=busybox:1.36 -- sh -c 'echo api-migrated' >/dev/null
kubectl -n mock3-q10 wait --for=condition=complete job/rotate-check --timeout=120s >/dev/null'''
undo = '''
kubectl -n mock3-q10 delete job rotate-check --ignore-not-found --wait=true >/dev/null
kubectl -n mock3-q10 delete cronjob rotate --ignore-not-found --wait=true >/dev/null
rm -f m3-batch-apis.txt m3-rotate.yaml'''

[[tasks.checks]]
name = '''Migrated template executes successfully'''
run = '''kubectl -n mock3-q10 logs job/rotate-check'''
equals = '''api-migrated'''

[[tasks]]
id = '''q11'''
domain = '''config-security'''
weight = 7
title = '''Project configuration and Pod metadata'''
namespace = '''mock3-q11'''
task = '''In `mock3-q11`, create ConfigMap `worker-settings` with file key `tuning.conf` containing `threads=4` plus a newline, and Secret `worker-token` with key token=`dojo-training-token`. Create Pod `projector`, image `busybox:1.36`, command `sleep 3600`. Mount one projected volume `bundle` read-only at `/run/dojo`: map ConfigMap tuning.conf to `config/tuning.conf`, Secret token to `auth/token`, and downwardAPI metadata.name to `identity/name`. Use fsGroup 2000, run as UID 1000/GID 2000, and set projected defaultMode 0440. All three files must be readable by the running application.'''
solution = '''
```bash
printf 'threads=4
' > "$PODDOJO_LAB_DIR/m3-tuning.conf"
kubectl -n mock3-q11 create configmap worker-settings --from-file=tuning.conf="$PODDOJO_LAB_DIR/m3-tuning.conf" --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q11 create secret generic worker-token --from-literal=token=dojo-training-token --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q11 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: projector}
spec:
  securityContext: {runAsUser: 1000, runAsGroup: 2000, fsGroup: 2000}
  containers:
  - name: projector
    image: busybox:1.36
    command: [sleep, '3600']
    volumeMounts: [{name: bundle, mountPath: /run/dojo, readOnly: true}]
  volumes:
  - name: bundle
    projected:
      defaultMode: 0440
      sources:
      - configMap:
          name: worker-settings
          items: [{key: tuning.conf, path: config/tuning.conf}]
      - secret:
          name: worker-token
          items: [{key: token, path: auth/token}]
      - downwardAPI:
          items:
          - path: identity/name
            fieldRef: {fieldPath: metadata.name}
EOF
kubectl -n mock3-q11 wait --for=condition=Ready pod/projector --timeout=120s
```'''

