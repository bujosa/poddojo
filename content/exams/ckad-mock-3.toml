[[tasks]]
id = '''q16'''
domain = '''networking'''
weight = 5
title = '''Serve TLS and mixed path types through an Ingress'''
namespace = '''mock3-q16'''
task = '''In `mock3-q16`, Deployment `edge-api` (Pod label app=edge-api, listening on 80) and the ClusterIP Service `edge-health` (port 80) already run. Expose `edge-api` as ClusterIP Service `edge-api` on port 80 targeting 80. Generate a self-signed certificate valid for DNS name `secure.dojo.test` (practice only), storing its key and certificate inside `$PODDOJO_LAB_DIR`, and create TLS Secret `edge-tls` from them. Create networking.k8s.io/v1 Ingress `edge` with ingressClassName `traefik` and TLS for host `secure.dojo.test` using `edge-tls`. For host `secure.dojo.test`, route `/api` with pathType Prefix to `edge-api` port 80 and `/healthz` with pathType Exact to `edge-health` port 80. The cluster's ingress controller answers inside the cluster at `https://traefik.dojo-ingress`; test from its curl client, for example `kubectl -n dojo-ingress exec deploy/probe -- curl -sk -H 'Host: secure.dojo.test' https://traefik.dojo-ingress/api/v1`.'''
setup = [
'''
kubectl -n mock3-q16 apply -f - <<'EOF'
apiVersion: v1
kind: ConfigMap
metadata: {name: echo-template}
data:
  default.conf.template: |
    server { listen 80; location / { default_type text/plain; return 200 "${BACKEND} $request_uri\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-api}
  template:
    metadata:
      labels: {app: edge-api}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env: [{name: BACKEND, value: edge-api}]
        ports: [{name: http, containerPort: 80}]
        volumeMounts: [{name: template, mountPath: /etc/nginx/templates}]
      volumes: [{name: template, configMap: {name: echo-template}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge-health}
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-health}
  template:
    metadata:
      labels: {app: edge-health}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env: [{name: BACKEND, value: edge-health}]
        ports: [{name: http, containerPort: 80}]
        volumeMounts: [{name: template, mountPath: /etc/nginx/templates}]
      volumes: [{name: template, configMap: {name: echo-template}}]
---
apiVersion: v1
kind: Service
metadata: {name: edge-health}
spec:
  selector: {app: edge-health}
  ports: [{port: 80, targetPort: 80}]
EOF''',
'''kubectl -n mock3-q16 rollout status deployment/edge-api --timeout=180s''',
'''kubectl -n mock3-q16 rollout status deployment/edge-health --timeout=180s'''
]
solution = '''
```bash
openssl req -x509 -nodes -newkey rsa:2048 -days 2 -subj '/CN=secure.dojo.test' -addext 'subjectAltName=DNS:secure.dojo.test' -keyout "$PODDOJO_LAB_DIR/m3-edge.key" -out "$PODDOJO_LAB_DIR/m3-edge.crt"
kubectl -n mock3-q16 create secret tls edge-tls --cert="$PODDOJO_LAB_DIR/m3-edge.crt" --key="$PODDOJO_LAB_DIR/m3-edge.key" --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q16 expose deployment edge-api --name=edge-api --port=80 --target-port=80 --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock3-q16 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: edge}
spec:
  ingressClassName: traefik
  tls:
  - hosts: [secure.dojo.test]
    secretName: edge-tls
  rules:
  - host: secure.dojo.test
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: {name: edge-api, port: {number: 80}}
      - path: /healthz
        pathType: Exact
        backend:
          service: {name: edge-health, port: {number: 80}}
EOF
kubectl -n dojo-ingress exec deploy/probe -- curl -sk --max-time 3 -H 'Host: secure.dojo.test' https://traefik.dojo-ingress/api/v1 || true
```
Traefik serves the Secret's certificate for SNI `secure.dojo.test`. Prefix `/api` matches `/api` and `/api/v1` (whole path segments), Exact `/healthz` matches only `/healthz`, and requests for other hosts never reach these backends. Without the `tls` section the controller would answer HTTPS with its own default certificate, which a client trusting `edge-tls` rejects.'''

[[tasks.checks]]
name = '''Prefix /api routes /api/v1 to edge-api over TLS verified with edge-tls'''
run = '''
kubectl -n mock3-q16 get secret edge-tls >/dev/null 2>&1 || exit 1
for i in $(seq 1 15); do
  v=$(kubectl -n mock3-q16 get secret edge-tls -o go-template='{{index .data "tls.crt" | base64decode}}' | kubectl -n dojo-ingress exec -i deploy/probe -- sh -c 'cat > /tmp/m3-q16-ca.pem && curl -sS --max-time 3 --cacert /tmp/m3-q16-ca.pem --connect-to secure.dojo.test:443:traefik.dojo-ingress:443 https://secure.dojo.test/api/v1' 2>&1)
  [ "$v" = "edge-api /api/v1" ] && echo ok && exit 0
  sleep 2
done
echo "$v"'''
equals = '''ok'''
timeout = 90

[[tasks.checks]]
name = '''Exact /healthz reaches edge-health, but /healthz/x does not'''
run = '''
for i in $(seq 1 15); do
  v=$(kubectl -n dojo-ingress exec deploy/probe -- curl -sk --max-time 3 -H 'Host: secure.dojo.test' https://traefik.dojo-ingress/healthz 2>&1)
  [ "$v" = "edge-health /healthz" ] && break
  sleep 2
done
[ "$v" = "edge-health /healthz" ] || { echo "/healthz: $v"; exit 0; }
c=$(kubectl -n dojo-ingress exec deploy/probe -- curl -sk --max-time 3 -H 'Host: secure.dojo.test' https://traefik.dojo-ingress/healthz/x 2>&1)
case "$c" in edge-health*|edge-api*) echo "/healthz/x reached a backend: $c";; *) echo ok;; esac'''
equals = '''ok'''
timeout = 90

