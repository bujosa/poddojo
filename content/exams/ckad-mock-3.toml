[[tasks]]
id = '''q01'''
domain = '''design-build'''
weight = 6
title = '''Package a non-root multistage web image'''
namespace = '''mock3-q01'''
task = '''Build `dojo/mock3-banner:v2` using a multi-stage Dockerfile under `$PODDOJO_LAB_DIR/banner-image`. Both stages must use `busybox:1.36`: in the builder turn source text `release candidate` into the page `RELEASE CANDIDATE` plus a newline; copy only that generated page into `/www/index.html` in the final stage. Set the image's runtime UID to 1000 and serve HTTP on 8080. Load it into kind cluster `poddojo`. In `mock3-q01` run one-replica Deployment `banner` with that image, imagePullPolicy IfNotPresent, and a read-only root filesystem. No registry push.'''
solution = '''
```bash
mkdir -p "$PODDOJO_LAB_DIR/banner-image"
printf 'release candidate
' > "$PODDOJO_LAB_DIR/banner-image/source.txt"
cat > "$PODDOJO_LAB_DIR/banner-image/Dockerfile" <<'EOF'
FROM busybox:1.36 AS builder
COPY source.txt /source.txt
RUN mkdir /out && tr '[:lower:]' '[:upper:]' < /source.txt > /out/index.html
FROM busybox:1.36
COPY --from=builder /out/index.html /www/index.html
USER 1000
EXPOSE 8080
CMD ["httpd", "-f", "-p", "8080", "-h", "/www"]
EOF
docker build -t dojo/mock3-banner:v2 "$PODDOJO_LAB_DIR/banner-image"
kind load docker-image dojo/mock3-banner:v2 --name poddojo
kubectl -n mock3-q01 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: banner}
spec:
  replicas: 1
  selector:
    matchLabels: {app: banner}
  template:
    metadata:
      labels: {app: banner}
    spec:
      containers:
      - name: banner
        image: dojo/mock3-banner:v2
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        securityContext: {readOnlyRootFilesystem: true, runAsNonRoot: true}
EOF
kubectl -n mock3-q01 rollout status deployment/banner --timeout=120s
```'''

[[tasks.checks]]
name = '''Image defaults to UID 1000'''
run = '''docker image inspect dojo/mock3-banner:v2 --format '{{.Config.User}}''''
equals = '''1000'''

[[tasks.checks]]
name = '''Deployment uses the loaded image with a read-only root'''
run = '''kubectl -n mock3-q01 get deployment/banner -o jsonpath='{.spec.template.spec.containers[0].image}{"|"}{.spec.template.spec.containers[0].imagePullPolicy}{"|"}{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}''''
equals = '''dojo/mock3-banner:v2|IfNotPresent|true'''

[[tasks.checks]]
name = '''Generated page is served on 8080'''
run = '''kubectl -n mock3-q01 exec deployment/banner -- wget -qO- http://127.0.0.1:8080/'''
equals = '''RELEASE CANDIDATE'''

[[tasks.checks]]
name = '''Dockerfile contains at least two build stages'''
run = '''test "$(grep -ic '^[[:space:]]*FROM[[:space:]]' "$PODDOJO_LAB_DIR/banner-image/Dockerfile")" -ge 2 && echo ok'''
equals = '''ok'''

[[tasks]]
id = '''q02'''
domain = '''design-build'''
weight = 7
title = '''Finish a Job with a native sidecar'''
namespace = '''mock3-q02'''
task = '''In `mock3-q02`, create Job `export` with restartPolicy Never and backoffLimit 1. Use `busybox:1.36` for every container. A regular init container `prepare` creates empty `/shared/result` in an emptyDir volume `exchange`. A native sidecar named `stream` tails that file to stdout and keeps running. The main container `exporter` writes `export-complete` plus a newline to the file and prints it to stdout before exiting successfully. Use the native restartable-init-container sidecar mechanism, so the sidecar does not block Job completion. Keep the completed Job.'''
solution = '''
```bash
kubectl -n mock3-q02 apply -f - <<'EOF'
apiVersion: batch/v1
kind: Job
metadata: {name: export}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      volumes:
      - name: exchange
        emptyDir: {}
      initContainers:
      - name: prepare
        image: busybox:1.36
        command: [sh, -c, 'touch /shared/result']
        volumeMounts: [{name: exchange, mountPath: /shared}]
      - name: stream
        image: busybox:1.36
        restartPolicy: Always
        command: [sh, -c, 'tail -n +1 -F /shared/result']
        volumeMounts: [{name: exchange, mountPath: /shared}]
      containers:
      - name: exporter
        image: busybox:1.36
        command: [sh, -c, 'echo export-complete > /shared/result; cat /shared/result']
        volumeMounts: [{name: exchange, mountPath: /shared}]
EOF
kubectl -n mock3-q02 wait --for=condition=complete job/export --timeout=120s
```'''

[[tasks.checks]]
name = '''Stream is a native restartable init container'''
run = '''kubectl -n mock3-q02 get job/export -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="stream")].restartPolicy}''''
equals = '''Always'''

[[tasks.checks]]
name = '''Ordinary preparation precedes the native sidecar'''
run = '''kubectl -n mock3-q02 get job/export -o jsonpath='{.spec.template.spec.initContainers[0].name}{"|"}{.spec.template.spec.initContainers[1].name}''''
equals = '''prepare|stream'''

[[tasks.checks]]
name = '''job/export completes'''
run = '''kubectl -n mock3-q02 wait --for=condition=complete job/export --timeout=90s >/dev/null && echo ok'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Exporter reports successful output'''
run = '''kubectl -n mock3-q02 logs job/export -c exporter'''
equals = '''export-complete'''

[[tasks.checks]]
name = '''Main and sidecar share ephemeral exchange storage'''
run = '''kubectl -n mock3-q02 get job/export -o jsonpath='{.spec.template.spec.volumes[?(@.name=="exchange")].emptyDir}{"|"}{.spec.template.spec.containers[?(@.name=="exporter")].volumeMounts[0].name}{"|"}{.spec.template.spec.initContainers[?(@.name=="stream")].volumeMounts[0].name}''''
equals = '''{}|exchange|exchange'''

[[tasks]]
id = '''q03'''
domain = '''design-build'''
weight = 7
title = '''Give replicas stable identities and storage'''
namespace = '''mock3-q03'''
task = '''In `mock3-q03`, create a two-replica StatefulSet `cache` using `busybox:1.36`, governed by headless Service `cache-headless` with port 8080. Each replica must have its own volumeClaimTemplate named `data`, standard StorageClass, ReadWriteOnce, requesting 64Mi, mounted at `/data`. On first start only, write the Pod hostname plus a newline into `/data/identity`; keep the container running. Verify `cache-0` and `cache-1` are ready. Delete only Pod `cache-0`, let the StatefulSet recreate it, and keep the existing claim and identity file.'''
solution = '''
```bash
kubectl -n mock3-q03 apply -f - <<'EOF'
apiVersion: v1
kind: Service
metadata: {name: cache-headless}
spec:
  clusterIP: None
  selector: {app: cache}
  ports: [{name: peer, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cache}
spec:
  serviceName: cache-headless
  replicas: 2
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
      - name: cache
        image: busybox:1.36
        command: [sh, -c, 'test -f /data/identity || hostname > /data/identity; sleep 3600']
        volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      storageClassName: standard
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 64Mi}
EOF
kubectl -n mock3-q03 rollout status statefulset/cache --timeout=240s
kubectl -n mock3-q03 delete pod cache-0 --wait=true
kubectl -n mock3-q03 wait --for=condition=Ready pod/cache-0 --timeout=180s
```'''

[[tasks.checks]]
name = '''Governing Service is headless'''
run = '''kubectl -n mock3-q03 get service/cache-headless -o jsonpath='{.spec.clusterIP}''''
equals = '''None'''

[[tasks.checks]]
name = '''statefulset/cache becomes ready'''
run = '''kubectl -n mock3-q03 get statefulset/cache >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock3-q03 get statefulset/cache -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "2" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Independent claims exist and are bound'''
run = '''kubectl -n mock3-q03 get pvc/data-cache-0 pvc/data-cache-1 -o jsonpath='{.items[*].status.phase}''''
equals = '''Bound Bound'''

[[tasks.checks]]
name = '''Each replica reads its own persisted identity'''
run = '''test "$(kubectl -n mock3-q03 exec cache-0 -- cat /data/identity)" = cache-0 && test "$(kubectl -n mock3-q03 exec cache-1 -- cat /data/identity)" = cache-1 && echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''Claim template requests persistent standard storage'''
run = '''kubectl -n mock3-q03 get statefulset/cache -o jsonpath='{.spec.serviceName}{"|"}{.spec.volumeClaimTemplates[0].metadata.name}{"|"}{.spec.volumeClaimTemplates[0].spec.storageClassName}{"|"}{.spec.volumeClaimTemplates[0].spec.accessModes[0]}{"|"}{.spec.volumeClaimTemplates[0].spec.resources.requests.storage}''''
equals = '''cache-headless|data|standard|ReadWriteOnce|64Mi'''

[[tasks]]
id = '''q04'''
domain = '''deployment'''
weight = 6
title = '''Introduce a canary into a shared Service'''
namespace = '''mock3-q04'''
task = '''In `mock3-q04`, Deployment `gateway-stable` has 3 replicas with Pod labels app=gateway,track=stable. Service `gateway` currently selects only stable. Create `gateway-canary`, one replica of `nginx:1.27-alpine`, labels app=gateway,track=canary. Configure `gateway` to route to both tracks by selecting app=gateway only. Keep all three stable replicas. Expect four ready backend addresses; no exact traffic percentage is guaranteed by Service load balancing.'''
setup = [
'''
kubectl -n mock3-q04 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-stable}
spec:
  replicas: 3
  selector:
    matchLabels: {app: gateway, track: stable}
  template:
    metadata:
      labels: {app: gateway, track: stable}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway, track: stable}
  ports: [{port: 80, targetPort: 80}]
EOF'''
]
solution = '''
```bash
kubectl -n mock3-q04 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-canary}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway, track: canary}
  template:
    metadata:
      labels: {app: gateway, track: canary}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
EOF
kubectl -n mock3-q04 rollout status deployment/gateway-stable --timeout=120s
kubectl -n mock3-q04 rollout status deployment/gateway-canary --timeout=120s
kubectl -n mock3-q04 patch service gateway --type=merge -p '{"spec":{"selector":{"app":"gateway","track":null}}}'
```'''

[[tasks.checks]]
name = '''deployment/gateway-canary becomes ready'''
run = '''kubectl -n mock3-q04 get deployment/gateway-canary >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock3-q04 get deployment/gateway-canary -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "1" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Service selects both tracks'''
run = '''kubectl -n mock3-q04 get service/gateway -o jsonpath='{.spec.selector.app}{"|"}{.spec.selector.track}''''
equals = '''gateway|'''

[[tasks.checks]]
name = '''Shared Service publishes four backend addresses'''
run = '''kubectl -n mock3-q04 get deployment/gateway-canary >/dev/null 2>&1 || exit 1; for i in $(seq 1 40); do count=$(kubectl -n mock3-q04 get endpointslices -l kubernetes.io/service-name=gateway -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]}{"\n"}{end}' | sort -u | sed '/^$/d' | wc -l | tr -d ' '); test "$count" = 4 && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Canary was introduced without scaling down stable'''
run = '''test "$(kubectl -n mock3-q04 get deployment/gateway-canary -o jsonpath='{.status.readyReplicas}')" = 1 && test "$(kubectl -n mock3-q04 get deployment/gateway-stable -o jsonpath='{.spec.replicas}')" = 3 && echo ok'''
equals = '''ok'''

[[tasks]]
id = '''q05'''
domain = '''deployment'''
weight = 5
title = '''Recover the previous Deployment revision'''
namespace = '''mock3-q05'''
task = '''In `mock3-q05`, Deployment `orders` has a bad latest revision. Use rollout history to restore the previous working revision, whose image is `nginx:1.26-alpine` and Pod-template annotation release=approved. Do not recreate the Deployment or lose its history. Scale to 2 replicas and wait until both run the restored template. Save rollout history output after recovery to `$PODDOJO_LAB_DIR/m3-orders-history.txt`.'''
setup = [
'''
kubectl -n mock3-q05 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      annotations: {release: approved}
      labels: {app: orders}
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
        ports: [{name: http, containerPort: 80}]
EOF''',
'''kubectl -n mock3-q05 rollout status deployment/orders --timeout=180s''',
'''
previous_revision=$(kubectl -n mock3-q05 get deployment orders -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
kubectl -n mock3-q05 patch deployment orders --type=strategic -p '{"spec":{"template":{"metadata":{"annotations":{"release":"rejected"}},"spec":{"containers":[{"name":"web","image":"nginx:dojo-missing-mock3"}]}}}}'
for i in $(seq 1 30); do test "$(kubectl -n mock3-q05 get deployment orders -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')" -gt "$previous_revision" 2>/dev/null && exit 0; sleep 2; done; exit 1'''
]
solution = '''
```bash
kubectl -n mock3-q05 rollout history deployment/orders
kubectl -n mock3-q05 rollout undo deployment/orders
kubectl -n mock3-q05 scale deployment orders --replicas=2
kubectl -n mock3-q05 rollout status deployment/orders --timeout=180s
kubectl -n mock3-q05 rollout history deployment/orders > "$PODDOJO_LAB_DIR/m3-orders-history.txt"
```'''

