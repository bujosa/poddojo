[[tasks]]
id = '''q09'''
domain = '''observability'''
weight = 5
title = '''Diagnose a failed Job and submit a corrected run'''
namespace = '''mock3-q09'''
task = '''In `mock3-q09`, Job `import-failed` has failed. Preserve it as evidence. Save its `importer` container log to `$PODDOJO_LAB_DIR/m3-import.log`, its numeric exit code to `$PODDOJO_LAB_DIR/m3-import-exit.txt`, and `kubectl describe job import-failed` output to `$PODDOJO_LAB_DIR/m3-import-describe.txt`. Create a separate Job `import-recovered` with image `busybox:1.36`, the same importer command, restartPolicy Never, backoffLimit 0, and the environment correction indicated by the log. Wait for successful completion.'''
setup = [
'''
kubectl -n mock3-q09 apply -f - <<'EOF'
apiVersion: batch/v1
kind: Job
metadata: {name: import-failed}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: importer
        image: busybox:1.36
        command: [sh, -c, 'if [ "$MODE" != restore ]; then echo ERROR missing MODE=restore; exit 23; fi; echo restore-complete']
EOF''',
'''kubectl -n mock3-q09 wait --for=condition=Failed job/import-failed --timeout=180s'''
]
solution = '''
```bash
kubectl -n mock3-q09 wait --for=condition=Failed job/import-failed --timeout=180s
kubectl -n mock3-q09 logs job/import-failed -c importer > "$PODDOJO_LAB_DIR/m3-import.log"
