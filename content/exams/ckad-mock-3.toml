  - name: api
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo ok > /w/index.html && httpd -p 9090 -h /w && httpd -f -p 8080 -h /w']
    ports: [{containerPort: 8080}, {containerPort: 9090}]
EOF''',
'''
kubectl -n mock3-q17-edge apply -f - <<'EOF'
apiVersion: v1
kind: Pod
