run = '''test "$(kubectl -n mock2-q16 get networkpolicy/database-ingress -o jsonpath='{.spec.ingress[1]}')" = '' && test "$(kubectl -n mock2-q16 get networkpolicy/database-ingress -o jsonpath='{.spec.ingress[0].from[1]}')" = '' && test "$(kubectl -n mock2-q16 get networkpolicy/database-ingress -o jsonpath='{.spec.ingress[0].from[0].namespaceSelector}')" = '' && test "$(kubectl -n mock2-q16 get networkpolicy/database-ingress -o jsonpath='{.spec.ingress[0].ports[1]}')" = '' && test "$(kubectl -n mock2-q16 get networkpolicy/database-ingress -o jsonpath='{.spec.ingress[0].ports[0].port}')" = 6379 && echo ok'''
equals = '''ok'''

[[tasks]]
id = '''q17'''
domain = '''networking'''
weight = 3
title = '''Default-deny egress for a batch tier'''
namespace = '''mock2-q17'''
task = '''In `mock2-q17`, create NetworkPolicy `batch-egress` selecting matchLabels tier=batch, with policyTypes Egress only and no allowed egress rules. Create Pod `batch`, labels tier=batch, image `busybox:1.36`, command `sleep 3600`. Do not isolate ingress or create namespace-wide restrictions. The policy specification is assessed, so DNS exceptions are not required.'''
solution = '''
```bash
kubectl -n mock2-q17 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: batch-egress}
spec:
  podSelector:
    matchLabels: {tier: batch}
  policyTypes: [Egress]
  egress: []
---
apiVersion: v1
kind: Pod
metadata: {name: batch, labels: {tier: batch}}
spec:
  containers:
  - name: batch
    image: busybox:1.36
    command: [sleep, '3600']
EOF
```'''

[[tasks.checks]]
name = '''Only the batch tier is selected'''
run = '''kubectl -n mock2-q17 get networkpolicy/batch-egress -o jsonpath='{.spec.podSelector.matchLabels.tier}{"|"}{.spec.policyTypes[*]}''''
equals = '''batch|Egress'''

[[tasks.checks]]
name = '''Existing policy allows no egress rules'''
run = '''kubectl -n mock2-q17 get networkpolicy batch-egress >/dev/null && test -z "$(kubectl -n mock2-q17 get networkpolicy/batch-egress -o jsonpath='{.spec.egress[*]}')" && echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''Batch workload has the selected label'''
run = '''kubectl -n mock2-q17 get pod/batch -o jsonpath='{.metadata.labels.tier}''''
equals = '''batch'''
