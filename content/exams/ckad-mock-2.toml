[[tasks]]
id = '''q15'''
domain = '''networking'''
weight = 6
title = '''Route a path prefix with an Ingress'''
namespace = '''mock2-q15'''
task = '''In `mock2-q15`, host `docs.dojo.test` is already served by Ingress `site` (class `traefik`, path `/` to Service `site`). ConfigMap `echo-template` holds an nginx configuration template. Create Deployment `docs`, one replica of `nginx:1.27-alpine`, with environment variable `BACKEND=docs` and ConfigMap `echo-template` mounted at `/etc/nginx/templates`. Expose it as ClusterIP Service `docs` on port 80 targeting port 80. Create networking.k8s.io/v1 Ingress `docs` with ingressClassName `traefik` that sends host `docs.dojo.test` path `/manual` (pathType `Prefix`) to Service `docs` port 80. Requests for `/manual` and `/manual/...` on that host must reach `docs`; every other path keeps reaching `site`, and other hosts must not reach `docs`. Test from inside the cluster with `kubectl -n dojo-ingress exec deploy/probe -- curl -s -H 'Host: docs.dojo.test' http://traefik.dojo-ingress/manual/intro`.'''
setup = [
'''
kubectl -n mock2-q15 apply -f - <<'EOF'
apiVersion: v1
kind: ConfigMap
metadata: {name: echo-template}
data:
  default.conf.template: |
    server { listen 80; location / { default_type text/plain; return 200 "${BACKEND} $request_uri\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: site}
spec:
  replicas: 1
  selector:
    matchLabels: {app: site}
  template:
    metadata:
      labels: {app: site}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env: [{name: BACKEND, value: site}]
        ports: [{name: http, containerPort: 80}]
        volumeMounts: [{name: templates, mountPath: /etc/nginx/templates}]
      volumes:
      - name: templates
        configMap: {name: echo-template}
---
apiVersion: v1
kind: Service
metadata: {name: site}
spec:
  selector: {app: site}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: site}
spec:
  ingressClassName: traefik
  rules:
  - host: docs.dojo.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: site, port: {number: 80}}
EOF''',
'''kubectl -n mock2-q15 rollout status deployment/site --timeout=180s'''
]
solution = '''
```bash
kubectl -n mock2-q15 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: docs}
spec:
  replicas: 1
  selector:
    matchLabels: {app: docs}
  template:
    metadata:
      labels: {app: docs}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        env: [{name: BACKEND, value: docs}]
        ports: [{name: http, containerPort: 80}]
        volumeMounts: [{name: templates, mountPath: /etc/nginx/templates}]
      volumes:
      - name: templates
        configMap: {name: echo-template}
---
apiVersion: v1
kind: Service
metadata: {name: docs}
spec:
  selector: {app: docs}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: docs}
spec:
  ingressClassName: traefik
  rules:
  - host: docs.dojo.test
    http:
      paths:
      - path: /manual
        pathType: Prefix
        backend:
          service: {name: docs, port: {number: 80}}
EOF
kubectl -n mock2-q15 rollout status deployment/docs --timeout=120s
kubectl -n dojo-ingress exec deploy/probe -- curl -s -H 'Host: docs.dojo.test' http://traefik.dojo-ingress/manual/intro
```
`Prefix` matches whole path segments: `/manual` and `/manual/intro` go to `docs`, `/manualx` does not (it falls back to the `/` rule of Ingress `site`).'''

