[[tasks]]
id = '''q16'''
domain = '''networking'''
weight = 4
title = '''Restrict incoming database connections'''
namespace = '''mock2-q16'''
task = '''In `mock2-q16`, Pod `database` (label app=database) listens on TCP 6379 (data) and TCP 6380 (admin). Client Pods `api` (role=api) and `other` (role=other) run in the same namespace, and another `api` Pod (role=api) runs in namespace `mock2-q16-ext`. Create NetworkPolicy `database-ingress` that selects the database Pods and allows incoming connections only on TCP 6379 and only from Pods labelled role=api in `mock2-q16`. All other ingress to the database (port 6380, the `other` Pod, Pods from other namespaces) must be denied. Do not restrict egress. Test with `kubectl -n mock2-q16 exec api -- wget -q -T 2 -O- http://<database-ip>:6379/`.'''
setup = [
'''
kubectl -n mock2-q16 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: database, labels: {app: database}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: db
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo ok > /w/index.html && httpd -p 6380 -h /w && httpd -f -p 6379 -h /w']
    ports: [{name: data, containerPort: 6379}, {name: admin, containerPort: 6380}]
---
apiVersion: v1
kind: Pod
metadata: {name: api, labels: {role: api}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '14400']}
---
apiVersion: v1
kind: Pod
metadata: {name: other, labels: {role: other}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '14400']}
EOF''',
'''
kubectl -n mock2-q16-ext apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: api, labels: {role: api}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '14400']}
EOF''',
'''kubectl -n mock2-q16 wait --for=condition=Ready pod/database pod/api pod/other --timeout=180s && kubectl -n mock2-q16-ext wait --for=condition=Ready pod/api --timeout=180s'''
]
solution = '''
```bash
kubectl -n mock2-q16 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: database-ingress}
spec:
  podSelector:
    matchLabels: {app: database}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {role: api}
    ports: [{protocol: TCP, port: 6379}]
EOF
```
A `podSelector` peer without a `namespaceSelector` only matches Pods in the policy's own namespace, and listing `ports` restricts the rule to 6379. Check it: `ip=$(kubectl -n mock2-q16 get pod database -o jsonpath='{.status.podIP}')`, then `kubectl -n mock2-q16 exec api -- wget -q -T 2 -O- http://$ip:6379/` works while the same request from `other`, to port 6380, or from `mock2-q16-ext` times out.'''

[[tasks.checks]]
name = '''role=api in mock2-q16 still reaches the database on 6379'''
run = '''kubectl -n mock2-q16 get networkpolicy database-ingress >/dev/null 2>&1 || exit 1; ip=$(kubectl -n mock2-q16 get pod database -o jsonpath='{.status.podIP}'); for i in $(seq 1 10); do kubectl -n mock2-q16 exec api -- wget -q -T 2 -O- "http://$ip:6379/" 2>/dev/null | grep -qx ok && echo ok && exit 0; sleep 1; done; echo blocked'''
equals = '''ok'''
timeout = 90

