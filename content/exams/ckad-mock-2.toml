[[tasks]]
id = '''q04'''
domain = '''deployment'''
weight = 6
title = '''Repair a rolling update'''
namespace = '''mock2-q04'''
task = '''Deployment `checkout` in `mock2-q04` is running an unavailable image. Set container `web` to `nginx:1.27-alpine`, scale to 3 replicas, and configure RollingUpdate with maxUnavailable 0 and maxSurge 1. Preserve its selector. Finish with all 3 replicas ready.'''
setup = [
'''
kubectl -n mock2-q04 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
      - name: web
        image: nginx:dojo-missing-mock2
        ports: [{name: http, containerPort: 80}]
EOF'''
]
solution = '''
```bash
kubectl -n mock2-q04 set image deployment/checkout web=nginx:1.27-alpine
kubectl -n mock2-q04 patch deployment checkout --type=merge -p '{"spec":{"replicas":3,"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxUnavailable":0,"maxSurge":1}}}}'
kubectl -n mock2-q04 rollout status deployment/checkout --timeout=180s
```'''

[[tasks.checks]]
name = '''Image is repaired'''
run = '''kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.spec.template.spec.containers[?(@.name=="web")].image}''''
equals = '''nginx:1.27-alpine'''

[[tasks.checks]]
name = '''Zero-unavailable rollout is configured'''
run = '''kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.spec.strategy.type}{"|"}{.spec.strategy.rollingUpdate.maxUnavailable}{"|"}{.spec.strategy.rollingUpdate.maxSurge}''''
matches = '''^RollingUpdate\|0%?\|1$'''

[[tasks.checks]]
name = '''Selector is preserved and 3 replicas become ready'''
run = '''test "$(kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.spec.selector.matchLabels.app}|{.spec.replicas}' 2>/dev/null)" = 'checkout|3' || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "3" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks.negatives]]
