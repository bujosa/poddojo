[[tasks]]
id = '''q08'''
domain = '''observability'''
weight = 8
title = '''Repair health checks'''
namespace = '''mock2-q08'''
task = '''In `mock2-q08`, Deployment `health` has a bad readiness probe. Keep the image `nginx:1.27-alpine`. Configure HTTP readiness and liveness probes on path `/`, port 80, each with periodSeconds 5 and failureThreshold 3. Add an HTTP startup probe on the same path/port with periodSeconds 2 and failureThreshold 30. Reach two ready replicas without deleting the Deployment.'''
setup = [
'''
kubectl -n mock2-q08 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: health}
spec:
  replicas: 1
  selector:
    matchLabels: {app: health}
  template:
    metadata:
      labels: {app: health}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /missing, port: 80}
          periodSeconds: 2
EOF'''
]
solution = '''
```bash
