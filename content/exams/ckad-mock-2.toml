[[tasks]]
id = '''q10'''
domain = '''config-security'''
weight = 6
title = '''Consume configuration and credentials'''
namespace = '''mock2-q10'''
task = '''In `mock2-q10`, create ConfigMap `settings` with MODE=exam and file key `app.conf` containing `workers=3` plus a newline. Create Opaque Secret `credentials` with password `dojo-demo-42` (practice data). Create Pod `consumer`, image `busybox:1.36`, running `sleep 3600`: inject MODE through a ConfigMap key reference, inject PASSWORD through a Secret key reference, and mount `app.conf` read-only at `/etc/dojo/app.conf`. Do not hard-code these values in the Pod.'''
solution = '''
```bash
printf 'workers=3\n' > "$PODDOJO_LAB_DIR/m2-app.conf"
kubectl -n mock2-q10 create configmap settings --from-literal=MODE=exam --from-file=app.conf="$PODDOJO_LAB_DIR/m2-app.conf" --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock2-q10 create secret generic credentials --from-literal=password=dojo-demo-42 --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock2-q10 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: consumer}
spec:
  containers:
  - name: consumer
    image: busybox:1.36
    command: [sleep, '3600']
    env:
    - name: MODE
      valueFrom:
        configMapKeyRef: {name: settings, key: MODE}
    - name: PASSWORD
      valueFrom:
        secretKeyRef: {name: credentials, key: password}
    volumeMounts: [{name: config, mountPath: /etc/dojo, readOnly: true}]
  volumes:
  - name: config
    configMap: {name: settings, items: [{key: app.conf, path: app.conf}]}
EOF
kubectl -n mock2-q10 wait --for=condition=Ready pod/consumer --timeout=120s
```'''

