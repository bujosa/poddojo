[[tasks]]
id = '''q11'''
domain = '''config-security'''
weight = 7
title = '''Run a least-privilege service account'''
namespace = '''mock2-q11'''
task = '''In `mock2-q11`, create ServiceAccount `inspector`, Role `pod-viewer` allowing only get/list/watch on core Pods, and RoleBinding `inspect-pods` binding that Role to that account. Create Pod `inspector`, image `busybox:1.36`, running `sleep 3600`, using this account without mounting its API token (automountServiceAccountToken=false). Run as UID/GID 1000, non-root (runAsNonRoot), with the RuntimeDefault seccomp profile; drop ALL capabilities, disable privilege escalation, and make the root filesystem read-only. The account must not be able to do anything else: no creating, changing or deleting Pods, no logs or exec, no Secrets or other resources.'''
solution = '''
```bash
kubectl -n mock2-q11 create serviceaccount inspector --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock2-q11 create role pod-viewer --verb=get,list,watch --resource=pods --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock2-q11 create rolebinding inspect-pods --role=pod-viewer --serviceaccount=mock2-q11:inspector --dry-run=client -o yaml | kubectl apply -f -
kubectl -n mock2-q11 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: inspector}
spec:
  serviceAccountName: inspector
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: inspector
    image: busybox:1.36
    command: [sleep, '3600']
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
EOF
kubectl -n mock2-q11 wait --for=condition=Ready pod/inspector --timeout=120s
```
Check the permissions the way the grader does: `kubectl -n mock2-q11 auth can-i delete pods --as=system:serviceaccount:mock2-q11:inspector` must say `no`.'''

[[tasks.checks]]
name = '''Account can get, list and watch Pods'''
run = '''kubectl -n mock2-q11 get serviceaccount inspector >/dev/null && for verb in get list watch; do test "$(kubectl -n mock2-q11 auth can-i "$verb" pods --as=system:serviceaccount:mock2-q11:inspector)" = yes || exit 1; done; echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''Account is denied every other verb and resource'''
run = '''kubectl -n mock2-q11 get rolebinding inspect-pods >/dev/null || exit 1; as=system:serviceaccount:mock2-q11:inspector; for a in 'create pods' 'update pods' 'patch pods' 'delete pods' 'deletecollection pods' 'get pods --subresource=log' 'create pods --subresource=exec' 'get secrets' 'list configmaps' 'list services' 'get deployments.apps' 'create serviceaccounts --subresource=token'; do r=$(kubectl -n mock2-q11 auth can-i $a --as=$as 2>/dev/null); [ "$r" = no ] || { echo "allowed: $a"; exit 0; }; done; echo ok'''
equals = '''ok'''

[[tasks.checks]]
name = '''RoleBinding inspect-pods grants Role pod-viewer to the account only'''
run = '''kubectl -n mock2-q11 get rolebinding/inspect-pods -o jsonpath='{.roleRef.kind}{"|"}{.roleRef.name}{"|"}{.subjects[*].kind}{"|"}{.subjects[*].name}{"|"}{.subjects[*].namespace}''''
matches = '''^Role\|pod-viewer\|ServiceAccount\|inspector\|(mock2-q11)?$'''

[[tasks.checks]]
name = '''Pod runs as the account with no API token mounted'''
run = '''test "$(kubectl -n mock2-q11 get pod/inspector -o jsonpath='{.spec.serviceAccountName}' 2>/dev/null)" = inspector || exit 1; kubectl -n mock2-q11 exec inspector -- sh -c 'test -e /var/run/secrets/kubernetes.io/serviceaccount/token && echo token-mounted || echo ok''''
equals = '''ok'''

[[tasks.checks]]
name = '''runAsNonRoot and the RuntimeDefault seccomp profile are in force'''
run = '''kubectl -n mock2-q11 get pod/inspector -o jsonpath='{.spec.securityContext.runAsNonRoot}{"|"}{.spec.containers[0].securityContext.runAsNonRoot}{"|"}{.spec.securityContext.seccompProfile.type}{"|"}{.spec.containers[0].securityContext.seccompProfile.type}' | awk -F'|' '{ nr = ($2 != "") ? $2 : $1; sc = ($4 != "") ? $4 : $3; print nr "|" sc }''''
equals = '''true|RuntimeDefault'''

[[tasks.checks]]
