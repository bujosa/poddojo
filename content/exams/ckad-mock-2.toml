[[tasks]]
id = '''q03'''
domain = '''design-build'''
weight = 7
title = '''Schedule a persistent report'''
namespace = '''mock2-q03'''
task = '''In `mock2-q03`, create a `standard` StorageClass PVC `reports`, ReadWriteOnce, requesting 64Mi. Create CronJob `report` with schedule `*/15 * * * *`, concurrencyPolicy `Forbid`, successfulJobsHistoryLimit 2, and image `busybox:1.36`. Each run must append `report-ok` plus a newline to `/reports/history` on the PVC. Create Job `report-now` from the CronJob and let it complete. Do not delete the successful Job or PVC. Create a reader Pod `reports-reader` from `busybox:1.36`, command `sleep 3600`, mounting `reports` read-only at `/reports`, so the persisted history can be inspected after the Job exits.'''
solution = '''
```bash
kubectl -n mock2-q03 apply -f - <<'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: reports}
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report}
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: busybox:1.36
            command: [sh, -c, 'echo report-ok >> /reports/history; cat /reports/history']
            volumeMounts: [{name: reports, mountPath: /reports}]
          volumes:
          - name: reports
            persistentVolumeClaim: {claimName: reports}
EOF
kubectl -n mock2-q03 create job report-now --from=cronjob/report
kubectl -n mock2-q03 wait --for=condition=complete job/report-now --timeout=180s
kubectl -n mock2-q03 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: reports-reader}
spec:
  containers:
  - name: reader
    image: busybox:1.36
    command: [sleep, '3600']
    volumeMounts: [{name: reports, mountPath: /reports, readOnly: true}]
  volumes:
  - name: reports
    persistentVolumeClaim: {claimName: reports}
EOF
kubectl -n mock2-q03 wait --for=condition=Ready pod/reports-reader --timeout=180s
```'''

[[tasks.checks]]
name = '''Schedule and concurrency are correct'''
run = '''kubectl -n mock2-q03 get cronjob/report -o jsonpath='{.spec.schedule}{"|"}{.spec.concurrencyPolicy}{"|"}{.spec.successfulJobsHistoryLimit}''''
equals = '''*/15 * * * *|Forbid|2'''

[[tasks.checks]]
name = '''Requested persistent claim is bound'''
run = '''kubectl -n mock2-q03 get pvc/reports -o jsonpath='{.status.phase}{"|"}{.spec.accessModes[0]}{"|"}{.spec.resources.requests.storage}{"|"}{.spec.storageClassName}''''
equals = '''Bound|ReadWriteOnce|64Mi|standard'''

[[tasks.checks]]
name = '''CronJob mounts the reports claim'''
run = '''kubectl -n mock2-q03 get cronjob/report -o jsonpath='{.spec.jobTemplate.spec.template.spec.volumes[?(@.name=="reports")].persistentVolumeClaim.claimName}''''
equals = '''reports'''

[[tasks.checks]]
name = '''job/report-now was created from the CronJob and completes'''
run = '''test "$(kubectl -n mock2-q03 get job/report-now -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')" = CronJob/report || exit 1; kubectl -n mock2-q03 wait --for=condition=complete job/report-now --timeout=90s >/dev/null && echo ok'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Report remains readable, read-only, after the Job exits'''
run = '''test "$(kubectl -n mock2-q03 get pod/reports-reader -o jsonpath='{.spec.containers[0].volumeMounts[?(@.mountPath=="/reports")].readOnly}')" = true || exit 1; kubectl -n mock2-q03 exec reports-reader -- cat /reports/history | grep -cx report-ok'''
matches = '''^[1-9][0-9]*$'''

[[tasks.negatives]]
name = '''Job report-now written by hand instead of created from the CronJob'''
run = '''
kubectl -n mock2-q03 apply -f - <<'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: reports}
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report}
