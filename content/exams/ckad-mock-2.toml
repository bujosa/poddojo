run = '''kubectl -n mock2-q11 exec inspector -- sh -c 'echo "$(id -u):$(id -g)"''''
equals = '''1000:1000'''

[[tasks.checks]]
name = '''No capabilities, no privilege escalation, a seccomp filter and a read-only root'''
run = '''kubectl -n mock2-q11 get pod/inspector >/dev/null 2>&1 || exit 1; s=$(kubectl -n mock2-q11 exec inspector -- cat /proc/1/status | grep -E '^(CapBnd|NoNewPrivs|Seccomp):' | tr -d ' \t' | tr '\n' ' '); if kubectl -n mock2-q11 exec inspector -- touch /dojo-probe >/dev/null 2>&1; then r=root-writable; else r=root-read-only; fi; echo "$s$r"'''
