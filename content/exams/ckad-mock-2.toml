[[tasks]]
id = '''q17'''
domain = '''networking'''
weight = 3
title = '''Default-deny egress for a batch tier'''
namespace = '''mock2-q17'''
task = '''In `mock2-q17`, Pod `batch` (label tier=batch) serves HTTP on port 8080, Pod `web` (label app=web) serves HTTP on port 8080, and Pod `report` (label tier=report) is a client. Create NetworkPolicy `batch-egress` so that Pods labelled tier=batch cannot open any outgoing connection, cluster DNS included. Do not isolate ingress: `report` must still reach `batch` on 8080. Do not create namespace-wide restrictions: `report` must still reach `web`.'''
setup = [
'''
kubectl -n mock2-q17 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: batch, labels: {tier: batch}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: batch
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo batch > /w/index.html && httpd -f -p 8080 -h /w']
---
apiVersion: v1
kind: Pod
metadata: {name: web, labels: {app: web}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: web
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo web > /w/index.html && httpd -f -p 8080 -h /w']
---
apiVersion: v1
kind: Pod
metadata: {name: report, labels: {tier: report}}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - {name: client, image: 'busybox:1.36', command: [sleep, '14400']}
EOF''',
'''kubectl -n mock2-q17 wait --for=condition=Ready pod/batch pod/web pod/report --timeout=180s'''
]
solution = '''
```bash
kubectl -n mock2-q17 apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: batch-egress}
spec:
  podSelector:
    matchLabels: {tier: batch}
  policyTypes: [Egress]
  egress: []
EOF
```
`policyTypes: [Egress]` with no egress rules denies every outgoing connection of the selected Pods, DNS included, and leaves their ingress alone. Without `policyTypes` the API would default to `[Ingress]` (there are no egress rules), which isolates ingress and leaves egress open.'''

