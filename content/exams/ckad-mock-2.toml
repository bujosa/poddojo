run = '''kubectl -n mock2-q16 get networkpolicy database-ingress >/dev/null 2>&1 || exit 1; ip=$(kubectl -n mock2-q16 get pod database -o jsonpath='{.status.podIP}'); for i in $(seq 1 10); do if ! kubectl -n mock2-q16 exec api -- wget -q -T 2 -O- "http://$ip:6380/" >/dev/null 2>&1; then kubectl -n mock2-q16 exec api -- wget -q -T 2 -O- "http://$ip:6380/" >/dev/null 2>&1 || { echo denied; exit 0; }; fi; sleep 1; done; echo reachable'''
