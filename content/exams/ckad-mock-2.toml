[[tasks]]
id = '''q05'''
domain = '''deployment'''
weight = 5
title = '''Switch a blue-green release'''
namespace = '''mock2-q05'''
task = '''In `mock2-q05`, implement blue-green deployment. Create `store-blue`, one replica of `nginx:1.27-alpine`, with Pod labels app=store,color=blue, and Service `store` on port 80 targeting 80. Create `store-green` with two ready replicas of the same image and Pod labels app=store,color=green. Finish with `store` selecting only app=store,color=green. Keep the blue Deployment running at one replica for rollback.'''
solution = '''
```bash
kubectl -n mock2-q05 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: store-blue}
spec:
  replicas: 1
  selector:
    matchLabels: {app: store, color: blue}
  template:
    metadata:
      labels: {app: store, color: blue}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: store}
spec:
  selector: {app: store, color: blue}
  ports: [{port: 80, targetPort: 80}]
EOF
kubectl -n mock2-q05 rollout status deployment/store-blue --timeout=120s
kubectl -n mock2-q05 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: store-green}
spec:
  replicas: 2
  selector:
    matchLabels: {app: store, color: green}
  template:
    metadata:
      labels: {app: store, color: green}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
EOF
kubectl -n mock2-q05 rollout status deployment/store-green --timeout=120s
kubectl -n mock2-q05 patch service store --type=merge -p '{"spec":{"selector":{"app":"store","color":"green"}}}'
```'''

[[tasks.checks]]
name = '''deployment/store-green becomes ready'''
run = '''kubectl -n mock2-q05 get deployment/store-green >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock2-q05 get deployment/store-green -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "2" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Service selects the green revision'''
run = '''kubectl -n mock2-q05 get service/store -o jsonpath='{.spec.selector.app}{"|"}{.spec.selector.color}''''
equals = '''store|green'''

[[tasks.checks]]
name = '''Green exists and blue remains available'''
run = '''[ "$(kubectl -n mock2-q05 get deployment/store-green -o jsonpath='{.status.readyReplicas}')" = 2 ] && [ "$(kubectl -n mock2-q05 get deployment/store-blue -o jsonpath='{.status.readyReplicas}')" = 1 ] && echo ok'''
equals = '''ok'''

