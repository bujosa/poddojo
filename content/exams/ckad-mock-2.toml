equals = '''nginx:1.27-alpine'''

[[tasks.checks]]
name = '''Zero-unavailable rollout is configured for the repaired image'''
run = '''kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.spec.template.spec.containers[0].image}{"|"}{.spec.strategy.type}{"|"}{.spec.strategy.rollingUpdate.maxUnavailable}{"|"}{.spec.strategy.rollingUpdate.maxSurge}''''
equals = '''nginx:1.27-alpine|RollingUpdate|0|1'''

[[tasks.checks]]
name = '''deployment/checkout becomes ready'''
run = '''kubectl -n mock2-q04 get deployment/checkout >/dev/null 2>&1 || exit 1; for i in $(seq 1 45); do v=$(kubectl -n mock2-q04 get deployment/checkout -o jsonpath='{.status.readyReplicas}' 2>/dev/null); [ "$v" = "3" ] && echo ok && exit 0; sleep 2; done; exit 1'''
