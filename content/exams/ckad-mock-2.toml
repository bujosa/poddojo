[[tasks]]
id = '''q01'''
domain = '''design-build'''
weight = 6
title = '''Build and run a local application image'''
namespace = '''mock2-q01'''
task = '''In namespace `mock2-q01`, run a one-replica Deployment `receipt` using an image you build as `dojo/mock2-receipt:v1`. Base it on `nginx:1.27-alpine`; HTTP port 80 must return exactly `receipt-v1` followed by a newline at `/`. Store the Dockerfile and page under `$PODDOJO_LAB_DIR/receipt-image`. Load the image into the `poddojo` kind cluster and use `IfNotPresent`. Do not push to a registry.'''
solution = '''
```bash
mkdir -p "$PODDOJO_LAB_DIR/receipt-image"
cat > "$PODDOJO_LAB_DIR/receipt-image/Dockerfile" <<'EOF'
FROM nginx:1.27-alpine
COPY index.html /usr/share/nginx/html/index.html
EOF
printf 'receipt-v1
' > "$PODDOJO_LAB_DIR/receipt-image/index.html"
docker build -t dojo/mock2-receipt:v1 "$PODDOJO_LAB_DIR/receipt-image"
kind load docker-image dojo/mock2-receipt:v1 --name poddojo
kubectl -n mock2-q01 apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: receipt}
spec:
  replicas: 1
  selector:
    matchLabels: {app: receipt}
  template:
    metadata:
      labels: {app: receipt}
    spec:
      containers:
      - name: web
        image: dojo/mock2-receipt:v1
        ports: [{name: http, containerPort: 80}]
        imagePullPolicy: IfNotPresent
EOF
kubectl -n mock2-q01 rollout status deployment/receipt --timeout=120s
```'''

[[tasks.checks]]
name = '''Deployment uses the locally built image'''
run = '''kubectl -n mock2-q01 get deployment/receipt -o jsonpath='{.spec.template.spec.containers[0].image}''''
equals = '''dojo/mock2-receipt:v1'''

[[tasks.checks]]
name = '''Image can be used without registry access'''
run = '''kubectl -n mock2-q01 get deployment/receipt -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}''''
equals = '''IfNotPresent'''

[[tasks.checks]]
name = '''Application serves the required receipt'''
run = '''kubectl -n mock2-q01 get deployment/receipt >/dev/null 2>&1 || exit 1; for i in $(seq 1 40); do v=$(kubectl -n mock2-q01 exec deployment/receipt -- wget -qO- http://127.0.0.1/ 2>/dev/null); [ "$v" = receipt-v1 ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = '''ok'''
timeout = 100

[[tasks]]
id = '''q02'''
domain = '''design-build'''
weight = 7
title = '''Initialize a shared ephemeral volume'''
namespace = '''mock2-q02'''
task = '''In `mock2-q02`, create Pod `catalog`. A regular init container `seed`, image `busybox:1.36`, must write `catalog-ready` plus a newline into an `emptyDir` named `site`. Container `web`, image `nginx:1.27-alpine`, must serve that file as `/index.html` on port 80. Mount the serving directory read-only in `web`. The init container must finish before the web container starts.'''
solution = '''
```bash
kubectl -n mock2-q02 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: catalog}
spec:
  volumes:
  - name: site
    emptyDir: {}
  initContainers:
  - name: seed
    image: busybox:1.36
    command: [sh, -c, 'printf "catalog-ready\n" > /seed/index.html']
    volumeMounts: [{name: site, mountPath: /seed}]
  containers:
  - name: web
    image: nginx:1.27-alpine
    ports: [{containerPort: 80}]
    volumeMounts: [{name: site, mountPath: /usr/share/nginx/html, readOnly: true}]
EOF
kubectl -n mock2-q02 wait --for=condition=Ready pod/catalog --timeout=120s
```'''

[[tasks.checks]]
name = '''Seed init container succeeded'''
run = '''kubectl -n mock2-q02 get pod/catalog -o jsonpath='{.status.initContainerStatuses[?(@.name=="seed")].state.terminated.exitCode}''''
equals = '''0'''

[[tasks.checks]]
name = '''Web volume is read-only'''
run = '''kubectl -n mock2-q02 get pod/catalog -o jsonpath='{.spec.containers[?(@.name=="web")].volumeMounts[?(@.mountPath=="/usr/share/nginx/html")].readOnly}''''
equals = '''true'''

[[tasks.checks]]
name = '''Initialized content is served'''
run = '''kubectl -n mock2-q02 exec catalog -c web -- wget -qO- http://127.0.0.1/'''
equals = '''catalog-ready'''

[[tasks.checks]]
name = '''Site is an emptyDir'''
run = '''kubectl -n mock2-q02 get pod/catalog -o jsonpath='{.spec.volumes[?(@.name=="site")].emptyDir}''''
equals = '''{}'''

[[tasks]]
id = '''q03'''
domain = '''design-build'''
weight = 7
title = '''Schedule a persistent report'''
namespace = '''mock2-q03'''
task = '''In `mock2-q03`, create a `standard` StorageClass PVC `reports`, ReadWriteOnce, requesting 64Mi. Create CronJob `report` with schedule `*/15 * * * *`, concurrencyPolicy `Forbid`, successfulJobsHistoryLimit 2, and image `busybox:1.36`. Each run must append `report-ok` plus a newline to `/reports/history` on the PVC. Create Job `report-now` from the CronJob and let it complete. Do not delete the successful Job or PVC. Create a reader Pod `reports-reader` from `busybox:1.36`, command `sleep 3600`, mounting `reports` read-only at `/reports`, so the persisted history can be inspected after the Job exits.'''
solution = '''
```bash
kubectl -n mock2-q03 apply -f - <<'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: reports}
spec:
  storageClassName: standard
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report}
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: busybox:1.36
            command: [sh, -c, 'echo report-ok >> /reports/history; cat /reports/history']
            volumeMounts: [{name: reports, mountPath: /reports}]
          volumes:
          - name: reports
            persistentVolumeClaim: {claimName: reports}
EOF
kubectl -n mock2-q03 create job report-now --from=cronjob/report
kubectl -n mock2-q03 wait --for=condition=complete job/report-now --timeout=180s
kubectl -n mock2-q03 apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: reports-reader}
spec:
  containers:
  - name: reader
    image: busybox:1.36
    command: [sleep, '3600']
    volumeMounts: [{name: reports, mountPath: /reports, readOnly: true}]
  volumes:
  - name: reports
    persistentVolumeClaim: {claimName: reports}
EOF
kubectl -n mock2-q03 wait --for=condition=Ready pod/reports-reader --timeout=180s
```'''

[[tasks.checks]]
name = '''Schedule and concurrency are correct'''
run = '''kubectl -n mock2-q03 get cronjob/report -o jsonpath='{.spec.schedule}{"|"}{.spec.concurrencyPolicy}{"|"}{.spec.successfulJobsHistoryLimit}''''
equals = '''*/15 * * * *|Forbid|2'''

[[tasks.checks]]
name = '''Requested persistent claim is bound'''
run = '''kubectl -n mock2-q03 get pvc/reports -o jsonpath='{.status.phase}{"|"}{.spec.accessModes[0]}{"|"}{.spec.resources.requests.storage}{"|"}{.spec.storageClassName}''''
equals = '''Bound|ReadWriteOnce|64Mi|standard'''

[[tasks.checks]]
name = '''CronJob mounts the reports claim'''
run = '''kubectl -n mock2-q03 get cronjob/report -o jsonpath='{.spec.jobTemplate.spec.template.spec.volumes[?(@.name=="reports")].persistentVolumeClaim.claimName}''''
equals = '''reports'''

[[tasks.checks]]
name = '''job/report-now completes'''
run = '''kubectl -n mock2-q03 wait --for=condition=complete job/report-now --timeout=90s >/dev/null && echo ok'''
equals = '''ok'''
timeout = 110

[[tasks.checks]]
name = '''Report remains readable after the Job exits'''
run = '''kubectl -n mock2-q03 exec reports-reader -- cat /reports/history | grep -x report-ok'''
equals = '''report-ok'''

