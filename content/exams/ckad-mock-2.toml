[[tasks]]
id = '''q07'''
domain = '''deployment'''
weight = 5
title = '''Build a Kustomize overlay'''
namespace = '''mock2-q07'''
task = '''Under `$PODDOJO_LAB_DIR/m2-kustomize`, create a reusable base Deployment `api` using `nginx:1.26-alpine` and one replica. Create an overlay `overlays/exam` targeting `mock2-q07` that adds prefix `exam-`, changes the image to `nginx:1.27-alpine`, and sets 2 replicas without modifying the base. Render the overlay to `$PODDOJO_LAB_DIR/m2-rendered.yaml`, apply the overlay, and leave `exam-api` ready.'''
solution = '''
```bash
mkdir -p "$PODDOJO_LAB_DIR/m2-kustomize/base" "$PODDOJO_LAB_DIR/m2-kustomize/overlays/exam"
cat > "$PODDOJO_LAB_DIR/m2-kustomize/base/deploy.yaml" <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
        ports: [{name: http, containerPort: 80}]
EOF
cat > "$PODDOJO_LAB_DIR/m2-kustomize/base/kustomization.yaml" <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deploy.yaml]
EOF
cat > "$PODDOJO_LAB_DIR/m2-kustomize/overlays/exam/kustomization.yaml" <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: mock2-q07
namePrefix: exam-
images:
- name: nginx
  newTag: 1.27-alpine
replicas:
- name: api
  count: 2
EOF
kubectl kustomize "$PODDOJO_LAB_DIR/m2-kustomize/overlays/exam" > "$PODDOJO_LAB_DIR/m2-rendered.yaml"
kubectl apply -k "$PODDOJO_LAB_DIR/m2-kustomize/overlays/exam"
kubectl -n mock2-q07 rollout status deployment/exam-api --timeout=120s
```'''

