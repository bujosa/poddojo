[[tasks]]
id = "q15"
domain = "networking"
weight = 6
title = "Route by host and path, and terminate TLS"
namespace = "mock1-q15"
task = "An Ingress controller (Traefik) is installed in the cluster; it serves every IngressClass whose controller is traefik.io/ingress-controller. Create IngressClass dojo-mock1 for that controller. In mock1-q15 the Services api and web (both port 80) already exist. Create Ingress shop (networking.k8s.io/v1, ingressClassName dojo-mock1) for host mock.dojo.test only: path /api with pathType Prefix goes to Service api port 80 (so /api/orders matches too), and path /health with pathType Exact goes to Service web port 80 (so /health/deep must not match). Create a self-signed TLS Secret mock-tls for mock.dojo.test (the certificate must carry DNS name mock.dojo.test) and use it to terminate HTTPS for that host. The openssl CLI is needed to generate this lab certificate."
setup = ["kubectl apply -f - <<'EOF'\napiVersion: v1\nkind: ConfigMap\nmetadata: {name: echo-template, namespace: mock1-q15}\ndata:\n  default.conf.template: |\n    server { listen 80; location / { default_type text/plain; return 200 \"${BACKEND} $request_uri\\n\"; } }\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: api, namespace: mock1-q15}\nspec:\n  replicas: 1\n  selector:\n    matchLabels: {app: api}\n  template:\n    metadata:\n      labels: {app: api}\n    spec:\n      volumes:\n      - name: tpl\n        configMap: {name: echo-template}\n      containers:\n      - name: echo\n        image: nginx:1.27-alpine\n        env: [{name: BACKEND, value: api}]\n        ports: [{name: http, containerPort: 80}]\n        volumeMounts: [{name: tpl, mountPath: /etc/nginx/templates}]\n        readinessProbe:\n          httpGet: {path: /, port: http}\n          periodSeconds: 2\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: mock1-q15}\nspec:\n  replicas: 1\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {app: web}\n    spec:\n      volumes:\n      - name: tpl\n        configMap: {name: echo-template}\n      containers:\n      - name: echo\n        image: nginx:1.27-alpine\n        env: [{name: BACKEND, value: web}]\n        ports: [{name: http, containerPort: 80}]\n        volumeMounts: [{name: tpl, mountPath: /etc/nginx/templates}]\n        readinessProbe:\n          httpGet: {path: /, port: http}\n          periodSeconds: 2\n---\napiVersion: v1\nkind: Service\nmetadata: {name: api, namespace: mock1-q15}\nspec:\n  selector: {app: api}\n  ports: [{name: http, port: 80, targetPort: http}]\n---\napiVersion: v1\nkind: Service\nmetadata: {name: web, namespace: mock1-q15}\nspec:\n  selector: {app: web}\n  ports: [{name: http, port: 80, targetPort: http}]\nEOF\nkubectl -n mock1-q15 rollout status deployment/api --timeout=120s\nkubectl -n mock1-q15 rollout status deployment/web --timeout=120s"]
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: dojo-mock1}
spec: {controller: traefik.io/ingress-controller}
EOF
cat > mock1-q15.cnf <<'EOF'
[req]
distinguished_name = dn
x509_extensions = san
prompt = no
[dn]
CN = mock.dojo.test
[san]
subjectAltName = DNS:mock.dojo.test
EOF
openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout mock1-q15.key -out mock1-q15.crt -config mock1-q15.cnf
kubectl -n mock1-q15 create secret tls mock-tls --cert=mock1-q15.crt --key=mock1-q15.key --dry-run=client -o yaml | kubectl apply -f -
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: mock1-q15}
spec:
  ingressClassName: dojo-mock1
  tls:
  - hosts: [mock.dojo.test]
    secretName: mock-tls
  rules:
  - host: mock.dojo.test
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: {name: api, port: {number: 80}}
      - path: /health
        pathType: Exact
        backend:
          service: {name: web, port: {number: 80}}
EOF
# Try it the way the grader does:
kubectl -n dojo-ingress exec deploy/probe -- curl -sS --max-time 5 --retry 5 --retry-all-errors -H 'Host: mock.dojo.test' http://traefik.dojo-ingress/api/orders || true
```
Prefix matches whole path elements, so `/api/orders` reaches `api`; Exact matches only `/health` itself. The rule names a host, so requests for any other host are not routed to these Services. The `tls` entry makes the controller serve the Secret's certificate for `mock.dojo.test`.'''

