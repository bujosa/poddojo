[[tasks]]
id = "q01"
domain = "design-build"
weight = 6
title = "Build and run an application image"
namespace = "mock1-q01"
task = "Build a local image dojo/mock1-web:v1 from nginx:1.27-alpine. Its default HTTP page must contain mock-one-image. Load it into the PodDojo kind cluster named poddojo. In mock1-q01 run Pod image-web from that image with imagePullPolicy IfNotPresent. Keep the Pod running and serving port 80. Work only inside dojo-mock1-build for build files."
setup = []
solution = '''```bash
mkdir -p dojo-mock1-build
cat > dojo-mock1-build/Dockerfile <<'EOF'
FROM nginx:1.27-alpine
RUN printf '%s\n' 'mock-one-image' > /usr/share/nginx/html/index.html
EOF
docker build -t dojo/mock1-web:v1 dojo-mock1-build
kind load docker-image dojo/mock1-web:v1 --name poddojo
kubectl apply -f - <<'EOF'
apiVersion: v1
kind: Pod
metadata: {name: image-web, namespace: mock1-q01}
spec:
  containers:
  - name: web
    image: dojo/mock1-web:v1
    imagePullPolicy: IfNotPresent
    ports: [{containerPort: 80}]
EOF
kubectl -n mock1-q01 wait --for=condition=Ready pod/image-web --timeout=120s
```'''

[[tasks.checks]]
name = "the named Docker image exists"
run = '''docker image inspect -f '{{range .RepoTags}}{{println .}}{{end}}' dojo/mock1-web:v1'''
contains = "dojo/mock1-web:v1"

[[tasks.checks]]
name = "the page is baked into the image itself"
run = '''docker run --rm --name dojo-mock1-q01-check --entrypoint sh dojo/mock1-web:v1 -c 'nginx && sleep 1 && wget -qO- -T 2 http://127.0.0.1/' '''
contains = "mock-one-image"
timeout = 60

[[tasks.checks]]
name = "the Pod uses the local image and pull policy"
run = '''kubectl -n mock1-q01 get pod image-web -o jsonpath='{.spec.containers[0].image}{" "}{.spec.containers[0].imagePullPolicy}''''
equals = "dojo/mock1-web:v1 IfNotPresent"

[[tasks.checks]]
name = "the application serves the built page"
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock1-q01 exec image-web -- wget -qO- -T 2 http://127.0.0.1); echo "$v" | grep -q mock-one-image && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.negatives]]
name = "image built without the page, which is then written into the running Pod"
run = '''printf 'FROM nginx:1.27-alpine\nLABEL dev.poddojo.case=page-not-baked-%s\n' "$(date +%s)" | docker build -q -t dojo/mock1-web:v1 - >/dev/null
kind load docker-image dojo/mock1-web:v1 --name poddojo
kubectl -n mock1-q01 run image-web --image=dojo/mock1-web:v1 --image-pull-policy=IfNotPresent --port=80
kubectl -n mock1-q01 wait --for=condition=Ready pod/image-web --timeout=240s
kubectl -n mock1-q01 exec image-web -- sh -c 'echo mock-one-image > /usr/share/nginx/html/index.html' '''
undo = '''kubectl -n mock1-q01 delete pod image-web --ignore-not-found --grace-period=1 --wait=true
docker image rm dojo/mock1-web:v1 >/dev/null 2>&1 || true'''

[[tasks]]
id = "q02"
domain = "design-build"
weight = 7
title = "Choose finite and scheduled workloads"
namespace = "mock1-q02"
task = "In mock1-q02 create Job once with busybox:1.36 that prints job-complete and finishes successfully. Also create CronJob heartbeat using busybox:1.36, schedule */5 * * * *, concurrencyPolicy Forbid and restartPolicy OnFailure; its command must print heartbeat. Suspend the CronJob so practice does not leave recurring work."
setup = []
solution = '''```bash
kubectl -n mock1-q02 create job once --image=busybox:1.36 -- sh -c 'echo job-complete'
kubectl -n mock1-q02 wait --for=condition=complete job/once --timeout=120s
kubectl apply -f - <<'EOF'
apiVersion: batch/v1
kind: CronJob
metadata: {name: heartbeat, namespace: mock1-q02}
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: heartbeat
            image: busybox:1.36
            command: [sh, -c, echo heartbeat]
EOF
```'''

[[tasks.checks]]
name = "the finite Job uses the requested image and completes"
run = '''[ "$(kubectl -n mock1-q02 get job once -o jsonpath='{.spec.template.spec.containers[0].image}')" = busybox:1.36 ] || exit 1; for i in $(seq 1 30); do v=$(kubectl -n mock1-q02 get job once -o jsonpath='{.status.succeeded}'); [ "$v" = 1 ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "the Job produces its required output"
run = '''kubectl -n mock1-q02 logs job/once'''
equals = "job-complete"

[[tasks.checks]]
name = "the schedule and concurrency controls are correct"
run = '''kubectl -n mock1-q02 get cronjob heartbeat -o jsonpath='{.spec.schedule}{"|"}{.spec.concurrencyPolicy}{"|"}{.spec.suspend}{"|"}{.spec.jobTemplate.spec.template.spec.restartPolicy}''''
equals = "*/5 * * * *|Forbid|true|OnFailure"

[[tasks.checks]]
name = "the scheduled workload uses the requested image and output command"
run = '''v=$(kubectl -n mock1-q02 get cronjob heartbeat -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}'); [ "$v" = busybox:1.36 ] && kubectl -n mock1-q02 get cronjob heartbeat -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].command[*]}{" "}{.spec.jobTemplate.spec.template.spec.containers[0].args[*]}''''
contains = "heartbeat"

[[tasks.negatives]]
name = "CronJob created imperatively and left active (no suspend, default concurrency)"
run = '''kubectl -n mock1-q02 create job once --image=busybox:1.36 -- sh -c 'echo job-complete'
kubectl -n mock1-q02 wait --for=condition=complete job/once --timeout=120s
kubectl -n mock1-q02 create cronjob heartbeat --image=busybox:1.36 --schedule='*/5 * * * *' -- sh -c 'echo heartbeat' '''
undo = '''kubectl -n mock1-q02 delete cronjob heartbeat --ignore-not-found
kubectl -n mock1-q02 delete job once --ignore-not-found --wait=true'''

[[tasks.alternatives]]
name = "Job from YAML and CronJob with args instead of command, suspended by a patch"
run = '''kubectl apply -f - <<'EOF'
apiVersion: batch/v1
kind: Job
metadata: {name: once, namespace: mock1-q02}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: once
        image: busybox:1.36
        args: [sh, -c, echo job-complete]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: heartbeat, namespace: mock1-q02}
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: heartbeat
            image: busybox:1.36
            args: [/bin/sh, -c, echo heartbeat]
EOF
kubectl -n mock1-q02 patch cronjob heartbeat --type=merge -p '{"spec":{"suspend":true,"concurrencyPolicy":"Forbid"}}'
kubectl -n mock1-q02 wait --for=condition=complete job/once --timeout=120s'''
undo = '''kubectl -n mock1-q02 delete cronjob heartbeat --ignore-not-found
kubectl -n mock1-q02 delete job once --ignore-not-found --wait=true'''

[[tasks]]
id = "q03"
domain = "design-build"
weight = 7
title = "Share persistent data with a native sidecar"
namespace = "mock1-q03"
task = "In mock1-q03 create PVC shared-data requesting 64Mi with access mode ReadWriteOnce and StorageClass standard. Create Pod shared with a native sidecar named writer (an init container with restartPolicy Always) from busybox:1.36. It must continuously write shared-ready into /data/message on that PVC. The main busybox:1.36 container reader mounts the same PVC at /data and remains running. Reading /data/message in reader must return shared-ready."
setup = []
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: shared-data, namespace: mock1-q03}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: {storage: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: shared, namespace: mock1-q03}
spec:
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: shared-data}
  initContainers:
  - name: writer
    image: busybox:1.36
    restartPolicy: Always
    command: [sh, -c, 'while true; do echo shared-ready > /data/message; sleep 2; done']
    volumeMounts: [{name: data, mountPath: /data}]
  containers:
  - name: reader
    image: busybox:1.36
    command: [sleep, '14400']
    volumeMounts: [{name: data, mountPath: /data}]
EOF
kubectl -n mock1-q03 wait --for=condition=Ready pod/shared --timeout=120s
```'''

[[tasks.checks]]
name = "the PVC binds with the requested class and access mode"
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock1-q03 get pvc shared-data -o jsonpath='{.status.phase}{" "}{.spec.storageClassName}{" "}{.spec.accessModes[0]}'); [ "$v" = "Bound standard ReadWriteOnce" ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "writer is a native sidecar"
run = '''kubectl -n mock1-q03 get pod shared -o jsonpath='{.spec.initContainers[?(@.name=="writer")].restartPolicy}{" "}{.spec.initContainers[?(@.name=="writer")].image}''''
equals = "Always busybox:1.36"

[[tasks.checks]]
name = "reader sees the sidecar data on the PVC"
run = '''v=$(kubectl -n mock1-q03 get pod shared -o jsonpath='{.spec.volumes[?(@.persistentVolumeClaim.claimName=="shared-data")].name}'); r=$(kubectl -n mock1-q03 get pod shared -o jsonpath='{.spec.containers[?(@.name=="reader")].volumeMounts[?(@.mountPath=="/data")].name}'); w=$(kubectl -n mock1-q03 get pod shared -o jsonpath='{.spec.initContainers[?(@.name=="writer")].volumeMounts[?(@.mountPath=="/data")].name}'); [ -n "$v" ] && [ "$r" = "$v" ] && [ "$w" = "$v" ] && kubectl -n mock1-q03 exec shared -c reader -- cat /data/message'''
equals = "shared-ready"

[[tasks.negatives]]
name = "writer added as a second regular container instead of a native sidecar"
run = '''kubectl apply -f - <<'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: shared-data, namespace: mock1-q03}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: {storage: 64Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: shared, namespace: mock1-q03}
spec:
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: shared-data}
  containers:
  - name: writer
    image: busybox:1.36
    command: [sh, -c, 'while true; do echo shared-ready > /data/message; sleep 2; done']
    volumeMounts: [{name: data, mountPath: /data}]
  - name: reader
    image: busybox:1.36
    command: [sleep, '14400']
    volumeMounts: [{name: data, mountPath: /data}]
EOF
kubectl -n mock1-q03 wait --for=condition=Ready pod/shared --timeout=120s'''
undo = '''kubectl -n mock1-q03 delete pod shared --ignore-not-found --grace-period=1 --wait=true
kubectl -n mock1-q03 delete pvc shared-data --ignore-not-found --wait=true'''

[[tasks]]
id = "q04"
domain = "deployment"
weight = 7
title = "Repair a rollout and add a canary"
namespace = "mock1-q04"
task = "The existing Deployment web in mock1-q04 uses an old image. Roll it to nginx:1.27-alpine with three replicas and RollingUpdate settings maxSurge 1 and maxUnavailable 0. Create one-replica Deployment canary using nginx:1.27-alpine. Both workloads must have Pod label route=shop. Create ClusterIP Service shop selecting route=shop on port 80 targeting numeric port 80. This approximates a 3:1 backend ratio, not a guaranteed per-request percentage."
setup = ["kubectl apply -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n  namespace: mock1-q04\nspec:\n  replicas: 2\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {\"app\": \"web\"}\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.26-alpine\n        ports:\n        - name: http\n          containerPort: 80\n        readinessProbe:\n          httpGet: {path: /, port: http}\n          periodSeconds: 2\nEOF\nkubectl -n mock1-q04 rollout status deployment/web --timeout=120s", "kubectl -n mock1-q04 scale deployment web --replicas=1"]
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: mock1-q04}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: web, route: shop}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: canary, namespace: mock1-q04}
spec:
  replicas: 1
  selector: {matchLabels: {app: canary}}
  template:
    metadata: {labels: {app: canary, route: shop}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: mock1-q04}
spec:
  selector: {route: shop}
  ports: [{port: 80, targetPort: 80}]
EOF
kubectl -n mock1-q04 rollout status deployment/web --timeout=120s
kubectl -n mock1-q04 rollout status deployment/canary --timeout=120s
```'''

[[tasks.checks]]
name = "the stable rollout uses the requested version and capacity"
run = '''kubectl -n mock1-q04 get deployment web -o jsonpath='{.spec.template.spec.containers[0].image}{" "}{.spec.replicas}{" "}{.spec.strategy.type}{" "}{.spec.strategy.rollingUpdate.maxSurge}{" "}{.spec.strategy.rollingUpdate.maxUnavailable}''''
equals = "nginx:1.27-alpine 3 RollingUpdate 1 0"

[[tasks.checks]]
name = "the requested replicas become ready"
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock1-q04 get deployment web -o jsonpath='{.status.readyReplicas}'); [ "$v" = 3 ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "a one-replica canary is configured on the shared route"
run = '''kubectl -n mock1-q04 get deployment canary -o jsonpath='{.spec.replicas}{" "}{.spec.template.metadata.labels.route}{" "}{.spec.template.spec.containers[0].image}''''
equals = "1 shop nginx:1.27-alpine"

[[tasks.checks]]
name = "the requested replicas become ready"
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock1-q04 get deployment canary -o jsonpath='{.status.readyReplicas}'); [ "$v" = 1 ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "the Service includes both labeled workloads"
run = '''[ "$(kubectl -n mock1-q04 get deployment web -o jsonpath='{.spec.template.metadata.labels.route}')" = shop ] && kubectl -n mock1-q04 get service shop -o jsonpath='{.spec.selector.route}{" "}{.spec.ports[0].port}{" "}{.spec.ports[0].targetPort}''''
equals = "shop 80 80"

[[tasks.checks]]
name = "the Service sends traffic to the three stable and one canary Pods"
run = '''for i in $(seq 1 30); do n=$(kubectl -n mock1-q04 get endpointslices -l kubernetes.io/service-name=shop -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]}{"\n"}{end}' | grep -c .); [ "$n" = 4 ] && echo ok && exit 0; sleep 2; done; echo "$n ready endpoints"'''
equals = "ok"
timeout = 90

[[tasks.negatives]]
name = "Service shop selects only the stable app=web Pods, leaving the canary out"
run = '''kubectl -n mock1-q04 set image deployment/web web=nginx:1.27-alpine
kubectl -n mock1-q04 scale deployment web --replicas=3
kubectl -n mock1-q04 patch deployment web --type=merge -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},"template":{"metadata":{"labels":{"route":"shop"}}}}}'
kubectl -n mock1-q04 create deployment canary --image=nginx:1.27-alpine
kubectl -n mock1-q04 patch deployment canary --type=merge -p '{"spec":{"template":{"metadata":{"labels":{"route":"shop"}}}}}'
kubectl -n mock1-q04 create service clusterip shop --tcp=80:80
kubectl -n mock1-q04 set selector service shop app=web
kubectl -n mock1-q04 rollout status deployment/web --timeout=120s
kubectl -n mock1-q04 rollout status deployment/canary --timeout=120s'''
undo = '''kubectl -n mock1-q04 delete deployment canary --ignore-not-found
kubectl -n mock1-q04 delete service shop --ignore-not-found
kubectl -n mock1-q04 delete deployment web --ignore-not-found --wait=true
kubectl apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mock1-q04
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {"app": "web"}
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 2
EOF
kubectl -n mock1-q04 rollout status deployment/web --timeout=120s'''

[[tasks.alternatives]]
name = "imperative repair: set image, scale, patch strategy and labels, create and re-select the Service"
run = '''kubectl -n mock1-q04 set image deployment/web web=nginx:1.27-alpine
kubectl -n mock1-q04 scale deployment web --replicas=3
kubectl -n mock1-q04 patch deployment web --type=merge -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},"template":{"metadata":{"labels":{"route":"shop"}}}}}'
kubectl -n mock1-q04 create deployment canary --image=nginx:1.27-alpine --replicas=1
kubectl -n mock1-q04 patch deployment canary --type=merge -p '{"spec":{"template":{"metadata":{"labels":{"route":"shop"}}}}}'
kubectl -n mock1-q04 create service clusterip shop --tcp=80:80
kubectl -n mock1-q04 set selector service shop route=shop
kubectl -n mock1-q04 rollout status deployment/web --timeout=120s
kubectl -n mock1-q04 rollout status deployment/canary --timeout=120s'''
undo = '''kubectl -n mock1-q04 delete deployment canary --ignore-not-found
kubectl -n mock1-q04 delete service shop --ignore-not-found
kubectl -n mock1-q04 delete deployment web --ignore-not-found --wait=true
kubectl apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mock1-q04
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {"app": "web"}
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 2
EOF
kubectl -n mock1-q04 rollout status deployment/web --timeout=120s'''

[[tasks]]
id = "q05"
domain = "deployment"
weight = 7
title = "Install a local Helm chart"
namespace = "mock1-q05"
task = "Create an offline local Helm chart in dojo-mock1-chart (apiVersion v2, chart name dojo-mock1, version 0.1.0). Install release dojo-mock1 in mock1-q05. The chart must render Deployment helm-web, two replicas, image nginx:1.27-alpine, and ClusterIP Service helm-web selecting the Pod label app=helm-web on port/targetPort 80. Use values for replica count and image. No remote chart repository is required."
setup = []
solution = '''```bash
mkdir -p dojo-mock1-chart/templates
cat > dojo-mock1-chart/Chart.yaml <<'EOF'
apiVersion: v2
name: dojo-mock1
version: 0.1.0
EOF
cat > dojo-mock1-chart/values.yaml <<'EOF'
replicaCount: 2
image: nginx:1.27-alpine
EOF
cat > dojo-mock1-chart/templates/web.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: helm-web}
  template:
    metadata:
      labels: {app: helm-web}
    spec:
      containers:
      - name: web
        image: {{ .Values.image | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: helm-web
spec:
  selector: {app: helm-web}
  ports: [{port: 80, targetPort: 80}]
EOF
helm upgrade --install dojo-mock1 ./dojo-mock1-chart -n mock1-q05 --wait --timeout 120s
```'''

[[tasks.checks]]
name = "release dojo-mock1 is deployed from chart dojo-mock1 0.1.0"
run = '''helm -n mock1-q05 list --filter '^dojo-mock1$' -o json'''
