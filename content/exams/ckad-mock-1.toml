[[tasks]]
id = "q16"
domain = "networking"
weight = 7
title = "Isolate both directions without losing DNS"
namespace = "mock1-q16"
task = "In mock1-q16 the Deployment web (nginx on TCP 80 plus a metrics sidecar on TCP 8080, label app=web), its Service web, the frontend Pod client (role=frontend) and Pod observer (role=observer, serving on 8080) are prepared. Another team runs Pod outsider in namespace mock1-q16-ext. Create NetworkPolicy default-deny that denies all ingress and all egress for every Pod in mock1-q16. Add server-ingress selecting app=web that allows only TCP 80 and only from role=frontend Pods in mock1-q16. Add frontend-egress selecting role=frontend that permits TCP 80 to app=web Pods in mock1-q16 and UDP and TCP 53 to the kube-system Pods labeled k8s-app=kube-dns, and nothing else. client must still resolve and retrieve http://web.mock1-q16.svc.cluster.local; the metrics port, observer, and every connection to or from other namespaces must stay blocked. Do not change workload labels or anything in mock1-q16-ext."
setup = ["kubectl create namespace mock1-q16-ext --dry-run=client -o yaml | kubectl apply -f -", '''kubectl apply -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: mock1-q16}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 2
      - name: metrics
        image: busybox:1.36
        command: [sh, -c, 'mkdir -p /w && echo metrics > /w/index.html && exec httpd -f -p 8080 -h /w']
        ports: [{name: metrics, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: mock1-q16}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: mock1-q16, labels: {role: frontend}}
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: [sleep, '14400']
---
apiVersion: v1
kind: Pod
metadata: {name: observer, namespace: mock1-q16, labels: {role: observer}}
spec:
  containers:
  - name: observer
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo observer > /w/index.html && exec httpd -f -p 8080 -h /w']
---
apiVersion: v1
kind: Pod
metadata: {name: outsider, namespace: mock1-q16-ext, labels: {role: frontend}}
spec:
  containers:
  - name: outsider
    image: busybox:1.36
    command: [sh, -c, 'mkdir -p /w && echo outsider > /w/index.html && httpd -p 53 -h /w && exec httpd -f -p 8080 -h /w']
EOF
kubectl -n mock1-q16 rollout status deployment/web --timeout=120s
kubectl -n mock1-q16 wait --for=condition=Ready pod/client pod/observer --timeout=120s
kubectl -n mock1-q16-ext wait --for=condition=Ready pod/outsider --timeout=120s''']
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: mock1-q16}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: server-ingress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {role: frontend}}
    ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {role: frontend}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: web}}
    ports: [{protocol: TCP, port: 80}]
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
EOF
kubectl -n mock1-q16 exec client -- wget -qO- -T 2 http://web.mock1-q16.svc.cluster.local | head -4
```
A `podSelector` peer without a `namespaceSelector` means "Pods in this policy's namespace", so outsider (role=frontend, other namespace) is not admitted. The DNS peer combines `namespaceSelector` and `podSelector` in **one** list item (AND), and both UDP and TCP 53 are open because DNS falls back to TCP for large answers.'''

[[tasks.checks]]
name = "the isolated frontend still resolves names (UDP and TCP 53) and loads the web page"
run = '''dns=$(kubectl -n kube-system get pods -l k8s-app=kube-dns -o jsonpath='{.items[0].status.podIP}'); for i in $(seq 1 12); do kubectl -n mock1-q16 exec client -- timeout 4 nslookup web.mock1-q16.svc.cluster.local >/dev/null 2>&1 && kubectl -n mock1-q16 exec client -- nc -z -w 2 "$dns" 53 >/dev/null 2>&1 && kubectl -n mock1-q16 exec client -- timeout 5 wget -q -T 2 -O- http://web.mock1-q16.svc.cluster.local/ 2>/dev/null | grep -q 'Welcome to nginx' && echo ok && exit 0; sleep 2; done; echo "client cannot resolve or reach web through its name"'''
equals = "ok"
timeout = 180

[[tasks.checks]]
name = "only same-namespace frontend Pods reach web:80 (outsider and observer are blocked)"
run = '''w=$(kubectl -n mock1-q16 get pods -l app=web -o jsonpath='{.items[0].status.podIP}'); [ -n "$w" ] || exit 1; ok=0; for i in $(seq 1 8); do if kubectl -n mock1-q16-ext exec outsider -- wget -q -T 2 -O- "http://$w/" >/dev/null 2>&1 || kubectl -n mock1-q16 exec observer -- wget -q -T 2 -O- "http://$w/" >/dev/null 2>&1; then ok=0; else ok=$((ok+1)); [ "$ok" -ge 2 ] && echo blocked && exit 0; fi; sleep 1; done; echo "a Pod outside the same-namespace frontend set still reaches web:80"'''
equals = "blocked"
timeout = 180

[[tasks.checks]]
name = "Pods without an allow rule stay isolated in both directions"
run = '''o=$(kubectl -n mock1-q16 get pod observer -o jsonpath='{.status.podIP}'); x=$(kubectl -n mock1-q16-ext get pod outsider -o jsonpath='{.status.podIP}'); [ -n "$o" ] && [ -n "$x" ] || exit 1; ok=0; for i in $(seq 1 8); do if kubectl -n mock1-q16-ext exec outsider -- wget -q -T 2 -O- "http://$o:8080/" >/dev/null 2>&1 || kubectl -n mock1-q16 exec observer -- wget -q -T 2 -O- "http://$x:8080/" >/dev/null 2>&1; then ok=0; else ok=$((ok+1)); [ "$ok" -ge 2 ] && echo isolated && exit 0; fi; sleep 1; done; echo "observer still accepts or opens connections"'''
equals = "isolated"
timeout = 180

[[tasks.checks]]
name = "the frontend can open nothing but web:80 and DNS (metrics port and other namespaces blocked)"
run = '''w=$(kubectl -n mock1-q16 get pods -l app=web -o jsonpath='{.items[0].status.podIP}'); x=$(kubectl -n mock1-q16-ext get pod outsider -o jsonpath='{.status.podIP}'); [ -n "$w" ] && [ -n "$x" ] || exit 1; ok=0; for i in $(seq 1 8); do if kubectl -n mock1-q16 exec client -- wget -q -T 2 -O- "http://$w:8080/" >/dev/null 2>&1 || kubectl -n mock1-q16 exec client -- wget -q -T 2 -O- "http://$x:8080/" >/dev/null 2>&1 || kubectl -n mock1-q16 exec client -- wget -q -T 2 -O- "http://$x:53/" >/dev/null 2>&1; then ok=0; else ok=$((ok+1)); [ "$ok" -ge 2 ] && echo limited && exit 0; fi; sleep 1; done; echo "client still opens a connection it should not"'''
equals = "limited"
timeout = 240

[[tasks.checks]]
name = "server-ingress itself admits only TCP 80 (port 80 or its name http)"
run = '''kubectl -n mock1-q16 get networkpolicy server-ingress -o go-template='{{.spec.podSelector.matchLabels.app}} {{range .spec.ingress}}[{{range .ports}}{{.port}}/{{.protocol}} {{end}}]{{end}}' '''
matches = '^web (\[(80|http)/TCP \])+$'

[[tasks.negatives]]
name = "server-ingress allows every source on every port (ingress: [{}])"
run = '''kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: mock1-q16}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: server-ingress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {role: frontend}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: web}}
    ports: [{protocol: TCP, port: 80}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
EOF'''
undo = '''kubectl -n mock1-q16 delete networkpolicy default-deny server-ingress frontend-egress --ignore-not-found'''

