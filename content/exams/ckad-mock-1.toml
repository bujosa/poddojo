[[tasks]]
id = "q13"
domain = "config-security"
weight = 6
title = "Extend discovery with a namespaced custom resource"
namespace = "mock1-q13"
task = "Create the lab-only CRD dojo-widgets.mock.poddojo.dev: group mock.poddojo.dev, plural dojo-widgets, singular dojo-widget, kind DojoWidget, scope Namespaced, one served/storage version v1. Its structural schema must require spec.message (string) and spec.replicas (integer, minimum 1), so the API server itself rejects a DojoWidget that is missing either field, has a non-string message, or asks for fewer than 1 replica. In mock1-q13 create DojoWidget sample with message=exam and replicas=2. No operator is installed: the CRD only adds API storage and validation, nothing reconciles the object into a workload."
setup = []
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dojo-widgets.mock.poddojo.dev
spec:
  group: mock.poddojo.dev
  scope: Namespaced
  names:
    plural: dojo-widgets
    singular: dojo-widget
    kind: DojoWidget
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [message, replicas]
            properties:
              message: {type: string}
              replicas: {type: integer, minimum: 1}
EOF
kubectl wait --for=condition=Established crd/dojo-widgets.mock.poddojo.dev --timeout=120s
kubectl apply -f - <<'EOF'
apiVersion: mock.poddojo.dev/v1
kind: DojoWidget
metadata: {name: sample, namespace: mock1-q13}
spec: {message: exam, replicas: 2}
EOF
kubectl -n mock1-q13 get dojo-widget sample
```'''

[[tasks.checks]]
name = "the custom API is established with the requested names, scope and version"
run = '''kubectl wait --for=condition=Established crd/dojo-widgets.mock.poddojo.dev --timeout=10s >/dev/null || exit 1; kubectl get crd dojo-widgets.mock.poddojo.dev -o jsonpath='{.spec.group} {.spec.names.plural} {.spec.names.singular} {.spec.names.kind} {.spec.scope}{range .spec.versions[*]} {.name}:{.served}:{.storage}{end}' '''
equals = "mock.poddojo.dev dojo-widgets dojo-widget DojoWidget Namespaced v1:true:true"

[[tasks.checks]]
name = "the API server accepts a valid widget and rejects ones that break the schema"
run = '''try() { printf 'apiVersion: mock.poddojo.dev/v1\nkind: DojoWidget\nmetadata: {name: dojo-probe}\nspec: {%s}\n' "$1" | kubectl -n mock1-q13 create --dry-run=server -f - >/dev/null 2>&1; }; try 'message: ok, replicas: 1' || { echo "a valid widget is rejected"; exit 1; }; for bad in 'replicas: 1' 'message: ok' 'message: ok, replicas: 0' 'message: ok, replicas: two' 'message: 5, replicas: 1'; do try "$bad" && { echo "accepted: $bad"; exit 1; }; done; echo enforced'''
equals = "enforced"
timeout = 60

[[tasks.checks]]
name = "the custom object stores the requested state"
run = '''kubectl -n mock1-q13 get dojo-widget sample -o jsonpath='{.apiVersion}{" "}{.spec.message}{" "}{.spec.replicas}' '''
equals = "mock.poddojo.dev/v1 exam 2"

[[tasks.negatives]]
name = "operator note written, CRD stores anything (no validating schema)"
run = '''printf '%s\n' 'A CRD adds storage; an operator controller reconciles custom resources.' > mock1-q13-operator.txt
kubectl apply -f - <<'EOF'
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dojo-widgets.mock.poddojo.dev
spec:
  group: mock.poddojo.dev
  scope: Namespaced
  names: {plural: dojo-widgets, singular: dojo-widget, kind: DojoWidget}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
EOF
