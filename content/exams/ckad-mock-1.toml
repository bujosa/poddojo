[[tasks]]
id = "q13"
domain = "config-security"
weight = 6
title = "Extend discovery with a namespaced custom resource"
namespace = "mock1-q13"
task = "Create the lab-only CRD dojo-widgets.mock.poddojo.dev: group mock.poddojo.dev, plural dojo-widgets, singular dojo-widget, kind DojoWidget, scope Namespaced, one served/storage version v1. Its structural schema must require spec.message (string) and spec.replicas (integer, minimum 1). In mock1-q13 create DojoWidget sample with message=exam and replicas=2. Save mock1-q13-operator.txt explaining that a CRD adds API storage/schema while an operator controller reconciles custom resources; no operator is installed or required here. This task practices API extension and the operator model; the CRD itself does not create any workload."
setup = []
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dojo-widgets.mock.poddojo.dev
spec:
  group: mock.poddojo.dev
  scope: Namespaced
  names:
    plural: dojo-widgets
    singular: dojo-widget
    kind: DojoWidget
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [message, replicas]
            properties:
              message: {type: string}
              replicas: {type: integer, minimum: 1}
EOF
kubectl wait --for=condition=Established crd/dojo-widgets.mock.poddojo.dev --timeout=120s
kubectl apply -f - <<'EOF'
apiVersion: mock.poddojo.dev/v1
kind: DojoWidget
metadata: {name: sample, namespace: mock1-q13}
spec: {message: exam, replicas: 2}
EOF
printf '%s\n' 'A CRD adds API storage and schema; an operator controller reconciles custom resources. No operator is installed here.' > mock1-q13-operator.txt
```'''

[[tasks.checks]]
name = "the custom API has namespaced scope and a storage version"
run = '''kubectl get crd dojo-widgets.mock.poddojo.dev -o jsonpath='{.spec.scope}{" "}{.spec.versions[0].name}{" "}{.spec.versions[0].served}{" "}{.spec.versions[0].storage}''''
equals = "Namespaced v1 true true"

[[tasks.checks]]
name = "the schema constrains the required application fields"
run = '''v=$(kubectl get crd dojo-widgets.mock.poddojo.dev -o jsonpath='{.spec.versions[0].schema.openAPIV3Schema.required[*]}'); [ "$v" = spec ] || exit 1; v=$(kubectl get crd dojo-widgets.mock.poddojo.dev -o jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.spec.required[*]}'); echo "$v" | tr ' ' '\n' | grep -qx message && echo "$v" | tr ' ' '\n' | grep -qx replicas && kubectl get crd dojo-widgets.mock.poddojo.dev -o jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.message.type}{" "}{.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.replicas.type}{" "}{.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.replicas.minimum}' '''
equals = "string integer 1"

[[tasks.checks]]
name = "the custom object stores the requested state"
run = '''kubectl -n mock1-q13 get dojo-widgets.mock.poddojo.dev sample -o jsonpath='{.apiVersion}{" "}{.spec.message}{" "}{.spec.replicas}''''
equals = "mock.poddojo.dev/v1 exam 2"

[[tasks.checks]]
name = "the operator distinction is recorded"
run = '''cat mock1-q13-operator.txt'''
contains = "reconciles"

