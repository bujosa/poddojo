[[tasks]]
id = "q15"
domain = "networking"
weight = 6
title = "Declare host, path and TLS routing"
namespace = "mock1-q15"
task = "In mock1-q15 create Ingress shop using networking.k8s.io/v1 and ingressClassName dojo-mock1. Create that IngressClass with controller traefik.io/ingress-controller. For host mock.dojo.test, route Prefix /api to existing Service web port 80 and Exact /health to the same Service. Create a self-signed TLS Secret mock-tls for mock.dojo.test and reference it from the Ingress. Do not install a controller; only object specifications are graded. The openssl CLI is needed to generate this lab certificate."
setup = ["kubectl apply -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n  namespace: mock1-q15\nspec:\n  replicas: 2\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {\"app\": \"web\"}\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports:\n        - name: http\n          containerPort: 80\n        readinessProbe:\n          httpGet: {path: /, port: http}\n          periodSeconds: 2\nEOF\nkubectl -n mock1-q15 rollout status deployment/web --timeout=120s", "kubectl apply -f - <<'EOF'\napiVersion: v1\nkind: Service\nmetadata:\n  name: web\n  namespace: mock1-q15\nspec:\n  type: ClusterIP\n  selector: {app: web}\n  ports:\n  - name: http\n    port: 80\n    targetPort: http\nEOF"]
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: dojo-mock1}
spec: {controller: traefik.io/ingress-controller}
EOF
cat > mock1-q15.cnf <<'EOF'
[req]
distinguished_name = dn
x509_extensions = san
prompt = no
[dn]
CN = mock.dojo.test
[san]
subjectAltName = DNS:mock.dojo.test
EOF
openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout mock1-q15.key -out mock1-q15.crt -config mock1-q15.cnf
kubectl -n mock1-q15 create secret tls mock-tls --cert=mock1-q15.crt --key=mock1-q15.key --dry-run=client -o yaml | kubectl apply -f -
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: mock1-q15}
spec:
  ingressClassName: dojo-mock1
  tls:
  - hosts: [mock.dojo.test]
    secretName: mock-tls
  rules:
  - host: mock.dojo.test
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: {name: web, port: {number: 80}}
      - path: /health
        pathType: Exact
        backend:
          service: {name: web, port: {number: 80}}
EOF
```'''

[[tasks.checks]]
name = "the Ingress selects the class and host"
run = '''kubectl -n mock1-q15 get ingress shop -o jsonpath='{.spec.ingressClassName}{" "}{.spec.rules[0].host}''''
equals = "dojo-mock1 mock.dojo.test"

[[tasks.checks]]
name = "the API prefix reaches the requested Service port"
run = '''kubectl -n mock1-q15 get ingress shop -o jsonpath='{.spec.rules[0].http.paths[?(@.path=="/api")].pathType}{" "}{.spec.rules[0].http.paths[?(@.path=="/api")].backend.service.name}{" "}{.spec.rules[0].http.paths[?(@.path=="/api")].backend.service.port.number}''''
equals = "Prefix web 80"

[[tasks.checks]]
name = "health uses an Exact route"
run = '''kubectl -n mock1-q15 get ingress shop -o jsonpath='{.spec.rules[0].http.paths[?(@.path=="/health")].pathType}{" "}{.spec.rules[0].http.paths[?(@.path=="/health")].backend.service.name}{" "}{.spec.rules[0].http.paths[?(@.path=="/health")].backend.service.port.number}''''
equals = "Exact web 80"

[[tasks.checks]]
name = "TLS references a TLS Secret for the host"
run = '''[ "$(kubectl -n mock1-q15 get secret mock-tls -o jsonpath='{.type}')" = kubernetes.io/tls ] && kubectl -n mock1-q15 get ingress shop -o jsonpath='{.spec.tls[0].hosts[0]}{" "}{.spec.tls[0].secretName}''''
equals = "mock.dojo.test mock-tls"

[[tasks.checks]]
name = "the class names the expected implementation"
run = '''kubectl get ingressclass dojo-mock1 -o jsonpath='{.spec.controller}''''
equals = "traefik.io/ingress-controller"

[[tasks]]
id = "q16"
domain = "networking"
weight = 7
title = "Isolate both directions without losing DNS"
namespace = "mock1-q16"
task = "In mock1-q16, default-deny ingress and egress for every Pod using policy default-deny. Add server-ingress selecting app=web, allowing only TCP 80 from same-namespace role=frontend Pods. Add frontend-egress selecting role=frontend, permitting TCP 80 to same-namespace app=web Pods and UDP/TCP 53 to kube-system Pods labeled k8s-app=kube-dns. Keep observer (role=observer) blocked. The prepared frontend client must retrieve http://web.mock1-q16.svc.cluster.local. Do not change workload labels."
setup = ["kubectl apply -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n  namespace: mock1-q16\nspec:\n  replicas: 2\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {\"app\": \"web\"}\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports:\n        - name: http\n          containerPort: 80\n        readinessProbe:\n          httpGet: {path: /, port: http}\n          periodSeconds: 2\nEOF\nkubectl -n mock1-q16 rollout status deployment/web --timeout=120s", "kubectl apply -f - <<'EOF'\napiVersion: v1\nkind: Service\nmetadata:\n  name: web\n  namespace: mock1-q16\nspec:\n  type: ClusterIP\n  selector: {app: web}\n  ports:\n  - name: http\n    port: 80\n    targetPort: http\nEOF", "kubectl -n mock1-q16 run client --image=busybox:1.36 --restart=Never --labels=role=frontend --dry-run=client -o yaml --command -- sleep 14400 | kubectl apply -f -\nkubectl -n mock1-q16 wait --for=condition=Ready pod/client --timeout=120s", "kubectl -n mock1-q16 run observer --image=busybox:1.36 --restart=Never --labels=role=observer --dry-run=client -o yaml --command -- sleep 14400 | kubectl apply -f -\nkubectl -n mock1-q16 wait --for=condition=Ready pod/observer --timeout=120s"]
solution = '''```bash
kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: mock1-q16}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: server-ingress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {role: frontend}}
    ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {role: frontend}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: web}}
    ports: [{protocol: TCP, port: 80}]
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
EOF
```'''

[[tasks.checks]]
name = "the default isolation covers both directions and all Pods"
run = '''types=$(kubectl -n mock1-q16 get networkpolicy default-deny -o jsonpath='{.spec.policyTypes[*]}'); [ "$types" = 'Ingress Egress' ] || [ "$types" = 'Egress Ingress' ] || exit 1; v=$(kubectl -n mock1-q16 get networkpolicy default-deny -o go-template='{{len .spec.podSelector}} {{if .spec.ingress}}{{len .spec.ingress}}{{else}}0{{end}} {{if .spec.egress}}{{len .spec.egress}}{{else}}0{{end}}'); [ "$v" = '0 0 0' ] && echo isolated'''
equals = "isolated"

[[tasks.checks]]
name = "the server permits the required frontend and port"
run = '''kubectl -n mock1-q16 get networkpolicy server-ingress -o jsonpath='{.spec.podSelector.matchLabels.app}{" "}{.spec.ingress[0].from[0].podSelector.matchLabels.role}{" "}{.spec.ingress[0].ports[0].port}''''
equals = "web frontend 80"

[[tasks.checks]]
name = "DNS permits both UDP and TCP"
run = '''v=$(kubectl -n mock1-q16 get networkpolicy frontend-egress -o jsonpath='{.spec.egress[*].ports[?(@.port==53)].protocol}'); echo "$v" | grep -q UDP && echo "$v" | grep -q TCP && echo dns'''
equals = "dns"

[[tasks.checks]]
name = "the frontend resolves and reaches the server"
run = '''kubectl -n mock1-q16 get networkpolicy frontend-egress >/dev/null && for i in $(seq 1 30); do v=$(kubectl -n mock1-q16 exec client -- wget -qO- -T 2 http://web.mock1-q16.svc.cluster.local); echo "$v" | grep -q "Welcome to nginx" && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "an untrusted observer cannot initiate HTTP to a server Pod"
run = '''kubectl -n mock1-q16 get networkpolicy default-deny >/dev/null && kubectl -n mock1-q16 wait --for=condition=Ready pod/observer --timeout=20s >/dev/null && ip=$(kubectl -n mock1-q16 get pods -l app=web -o jsonpath='{.items[0].status.podIP}') && [ -n "$ip" ] && for i in $(seq 1 20); do hits=0; for j in 1 2 3; do if kubectl -n mock1-q16 exec observer -- wget -qO- -T 2 "http://$ip" >/dev/null 2>&1; then break; else hits=$((hits+1)); fi; done; [ "$hits" = 3 ] && echo blocked && exit 0; sleep 2; done; exit 1'''
equals = "blocked"
timeout = 180
