[[tasks]]
id = "q06"
domain = "deployment"
weight = 6
title = "Customize an application with Kustomize"
namespace = "mock1-q06"
task = "Create a base and stage overlay under dojo-mock1-kustomize. The base Deployment app has one replica and image nginx:1.26-alpine. The overlay targets mock1-q06, prefixes names with stage-, sets replicas to three and replaces the nginx tag with 1.27-alpine. Apply the overlay with kubectl apply -k. The resulting Deployment must be stage-app with three ready replicas."
setup = []
solution = '''```bash
mkdir -p dojo-mock1-kustomize/base dojo-mock1-kustomize/stage
cat > dojo-mock1-kustomize/base/deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: app}
spec:
  replicas: 1
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
      - name: web
        image: nginx:1.26-alpine
EOF
cat > dojo-mock1-kustomize/base/kustomization.yaml <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml]
EOF
cat > dojo-mock1-kustomize/stage/kustomization.yaml <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../base]
namespace: mock1-q06
namePrefix: stage-
replicas:
- name: app
  count: 3
images:
- name: nginx
  newTag: 1.27-alpine
EOF
kubectl apply -k dojo-mock1-kustomize/stage
kubectl -n mock1-q06 rollout status deployment/stage-app --timeout=120s
```'''

[[tasks.checks]]
name = "the overlay deploys the new image and replica count"
run = '''kubectl -n mock1-q06 get deployment stage-app -o jsonpath='{.spec.replicas}{" "}{.spec.template.spec.containers[0].image}''''
equals = "3 nginx:1.27-alpine"

[[tasks.checks]]
name = "the requested replicas become ready"
run = '''for i in $(seq 1 30); do v=$(kubectl -n mock1-q06 get deployment stage-app -o jsonpath='{.status.readyReplicas}'); [ "$v" = 3 ] && echo ok && exit 0; sleep 2; done; exit 1'''
equals = "ok"
timeout = 120

[[tasks.checks]]
name = "the base keeps the original app and the stage overlay builds on it"
run = '''b=$(kubectl kustomize dojo-mock1-kustomize/base) || exit 1; o=$(kubectl kustomize dojo-mock1-kustomize/stage) || exit 1; bv=$(printf '%s\n' "$b" | kubectl create --dry-run=client -f - -o jsonpath='{.metadata.name} {.spec.replicas} {.spec.template.spec.containers[0].image}'); ov=$(printf '%s\n' "$o" | kubectl create --dry-run=client -f - -o jsonpath='{.metadata.namespace} {.metadata.name} {.spec.replicas} {.spec.template.spec.containers[0].image}'); grep -qE '\.\./base' dojo-mock1-kustomize/stage/kustomization.yaml || exit 1; echo "$bv | $ov"'''
equals = "app 1 nginx:1.26-alpine | mock1-q06 stage-app 3 nginx:1.27-alpine"

[[tasks.negatives]]
name = "final values written into the base, overlay only renames and moves it"
run = '''mkdir -p dojo-mock1-kustomize/base dojo-mock1-kustomize/stage
cat > dojo-mock1-kustomize/base/deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata: {name: app}
spec:
  replicas: 3
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
EOF
printf 'resources: [deployment.yaml]\n' > dojo-mock1-kustomize/base/kustomization.yaml
printf 'resources: [../base]\nnamespace: mock1-q06\nnamePrefix: stage-\n' > dojo-mock1-kustomize/stage/kustomization.yaml
kubectl apply -k dojo-mock1-kustomize/stage
kubectl -n mock1-q06 rollout status deployment/stage-app --timeout=120s'''
undo = '''kubectl -n mock1-q06 delete deployment stage-app --ignore-not-found --wait=true
rm -rf dojo-mock1-kustomize'''

[[tasks.alternatives]]
name = "overlay changes replicas and tag with an inline patch, rendered with kubectl kustomize"
run = '''mkdir -p dojo-mock1-kustomize/base dojo-mock1-kustomize/stage
cat > dojo-mock1-kustomize/base/deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: {app: app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
      - name: web
        image: "nginx:1.26-alpine"
EOF
printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n- deployment.yaml\n' > dojo-mock1-kustomize/base/kustomization.yaml
cat > dojo-mock1-kustomize/stage/kustomization.yaml <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mock1-q06
namePrefix: stage-
resources:
- ../base
patches:
- target: {kind: Deployment, name: app}
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: nginx:1.27-alpine
EOF
kubectl kustomize dojo-mock1-kustomize/stage | kubectl apply -f -
kubectl -n mock1-q06 rollout status deployment/stage-app --timeout=120s'''
undo = '''kubectl -n mock1-q06 delete deployment stage-app --ignore-not-found --wait=true
rm -rf dojo-mock1-kustomize'''

