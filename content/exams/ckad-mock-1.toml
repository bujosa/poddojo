[[tasks.alternatives]]
name = "named port http, inferred policyTypes and an explicit namespace peer for the frontend"
run = '''kubectl apply -f - <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: mock1-q16}
spec:
  podSelector: {}
  policyTypes: [Egress, Ingress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: server-ingress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {app: web}}
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mock1-q16}}
      podSelector: {matchLabels: {role: frontend}}
    ports: [{port: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: mock1-q16}
spec:
  podSelector: {matchLabels: {role: frontend}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports:
    - {port: 53, protocol: TCP}
    - {port: 53, protocol: UDP}
  - to:
    - podSelector: {matchLabels: {app: web}}
    ports: [{port: http, protocol: TCP}]
EOF'''
undo = '''kubectl -n mock1-q16 delete networkpolicy default-deny server-ingress frontend-egress --ignore-not-found'''
