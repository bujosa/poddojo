run = '''[ "$(kubectl -n mock1-q10 get secret message -o jsonpath='{.data.text}' | base64 -d)" = practice-message ] || exit 1; kubectl -n mock1-q10 exec configured -- sh -c 'echo "$MODE:$(cat /message/text)"' '''
