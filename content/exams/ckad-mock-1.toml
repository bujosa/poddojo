namespace = "mock1-q07"
task = "Deployment web in mock1-q07 runs but does not become ready. Inspect events and its probe. Repair readiness to HTTP GET / on port http. Add HTTP startup and liveness probes on the same path and named port, each with periodSeconds 2 and failureThreshold 30. Do not remove readiness or change the image. Finish with one ready replica."
setup = ["kubectl apply -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: mock1-q07}\nspec:\n  replicas: 1\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports: [{name: http, containerPort: 80}]\n        readinessProbe:\n          httpGet: {path: /wrong, port: 80}\n          periodSeconds: 2\nEOF"]
solution = '''```bash
kubectl -n mock1-q07 describe pods -l app=web
kubectl -n mock1-q07 patch deployment web --type=merge -p '{"spec":{"template":{"spec":{"containers":[{"name":"web","image":"nginx:1.27-alpine","ports":[{"name":"http","containerPort":80}],"readinessProbe":{"httpGet":{"path":"/","port":"http"},"periodSeconds":2},"startupProbe":{"httpGet":{"path":"/","port":"http"},"periodSeconds":2,"failureThreshold":30},"livenessProbe":{"httpGet":{"path":"/","port":"http"},"periodSeconds":2,"failureThreshold":30}}]}}}}'
kubectl -n mock1-q07 rollout status deployment/web --timeout=120s
```'''

