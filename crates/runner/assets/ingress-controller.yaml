# PodDojo's lab Ingress controller: Traefik (maintained, Apache-2.0), installed on demand by labs
# and exams that declare `requires = ["ingress-controller"]`. It serves the Ingress API for every
# IngressClass whose spec.controller is traefik.io/ingress-controller (the `traefik` class below,
# or classes the learner creates). Inside the cluster it answers on
# http://traefik.dojo-ingress and https://traefik.dojo-ingress; HTTPS is also published on the
# machine through NodePort 30443 (https://$PODDOJO_HOST:30443). Deployment `probe` is a curl
# client that labs and graders use to send requests with any Host header from inside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: dojo-ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: dojo-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dojo-ingress-traefik
rules:
- apiGroups: [""]
  resources: [services, secrets, nodes]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, ingressclasses]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses/status]
  verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dojo-ingress-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dojo-ingress-traefik
subjects:
- kind: ServiceAccount
  name: traefik
  namespace: dojo-ingress
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: dojo-ingress
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: traefik
      containers:
      - name: traefik
        image: traefik:v3.7.8
        imagePullPolicy: IfNotPresent
        args:
        - --entryPoints.web.address=:8000
        - --entryPoints.websecure.address=:8443
        - --entryPoints.websecure.http.tls=true
        - --providers.kubernetesingress
        - --providers.kubernetesingress.strictPrefixMatching=true
        - --ping
        - --log.level=INFO
        ports:
        - {name: web, containerPort: 8000}
        - {name: websecure, containerPort: 8443}
        readinessProbe:
          httpGet: {path: /ping, port: 8080}
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: dojo-ingress
spec:
  type: NodePort
  selector: {app: traefik}
  ports:
  - {name: web, port: 80, targetPort: web}
  - {name: websecure, port: 443, targetPort: websecure, nodePort: 30443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: dojo-ingress
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe}
  template:
    metadata:
      labels: {app: probe}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.13.0
        imagePullPolicy: IfNotPresent
        command: [sleep, infinity]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 100
          capabilities: {drop: [ALL]}
