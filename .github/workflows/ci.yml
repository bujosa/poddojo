name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # Linux only: macOS runner minutes cost about 10x on private repositories. macOS is covered
    # locally by `cargo xtask ci` and `cargo xtask bundle`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
