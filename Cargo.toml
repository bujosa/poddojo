[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bujosa/poddojo"

[workspace.dependencies]
# internal
poddojo-core = { path = "crates/core" }
poddojo-runner = { path = "crates/runner" }
poddojo-ui = { path = "crates/ui" }

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
dirs = "6"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
pulldown-cmark = { version = "0.13", default-features = false }
log = "0.4"

# terminal: a pseudo-terminal and a VT100 screen model (both small, pure Rust)
pty-process = "0.5"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
vt100 = "0.18"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# PodDojo never crashes: shipped code returns `Result`/`Option` instead of panicking (AGENTS.md ›
# Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Ultralight: small, fast binaries.
[profile.release]
lto = "thin"
codegen-units = 4
strip = true
